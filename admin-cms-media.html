<!DOCTYPE html>
<!-- SBOS V3-5 marker: Media library references for GitHub Pages-safe assets. -->
<html lang="th"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SBOS CMS Media</title><link rel="icon" href="images/logo.png" /><link rel="stylesheet" href="css/sbos-typography.css" /><link rel="stylesheet" href="css/sbos-cms.css" /></head>
<body data-cms-page="dashboard"><div class="cms-shell"><aside class="cms-side"><div class="cms-brand"><img src="images/logo.png" alt="Siamtham" /><div><strong>SBOS CMS</strong><span>Media</span></div></div><nav class="cms-menu" aria-label="CMS navigation"><a href="admin-cms.html">Dashboard</a><a href="admin-cms-banners.html">Banners</a><a class="active" href="admin-cms-media.html">Media</a><a href="admin-cms-audit.html">Audit</a></nav></aside><main class="cms-main"><header class="cms-top"><div><h1>Media Library</h1><p>Register safe public URLs. No binary upload is stored in Apps Script.</p></div><button id="refreshButton" class="cms-btn" type="button">Refresh</button></header><section class="cms-content"><form id="cmsMediaForm" class="cms-form"><label>Public URL<input name="public_url" type="url" required /></label><label>File Name<input name="file_name" required /></label><label>Media Type<select name="media_type"><option>IMAGE</option><option>DOCUMENT</option><option>VIDEO</option></select></label><label>MIME Type<input name="mime_type" placeholder="image/png" /></label><label class="wide">Alt Text TH<input name="alt_text_th" /></label><label class="wide">Alt Text EN<input name="alt_text_en" /></label><label>Status<select name="status"><option>ACTIVE</option><option>INACTIVE</option></select></label><button class="cms-btn" type="submit">Register Media</button></form><section class="cms-panel"><h3>Recent Content</h3><div class="cms-table-wrap"><table class="cms-table"><thead><tr><th>Content ID</th><th>Type</th><th>Title</th><th>Status</th><th>Related</th></tr></thead><tbody id="contentRows"></tbody></table></div></section></section></main></div><div id="cmsToast" class="cms-toast" role="status" aria-live="polite"></div><script src="js/admin-guard.js"></script><script src="js/sbos-api-config.js"></script><script src="js/sbos-cms-admin.js"></script></body></html>
