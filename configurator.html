<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSB Configurator</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont;
      background: #f8fafc;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

<!-- Header -->
<header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-semibold text-slate-800">
      Stealth Safety Bank
    </h1>
    <div class="text-sm text-slate-500">
      Secure • Invisible • Premium
    </div>
  </div>
</header>

<!-- Hero -->
<section class="bg-gradient-to-r from-blue-50 to-blue-100 py-12">
  <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-8 items-center">
    <div>
      <h2 class="text-3xl font-bold text-slate-800 mb-4">
        Custom SafetyBook System
      </h2>
      <p class="text-slate-600 mb-6">
        ออกแบบเครื่องเก็บเงินนิรภัยล่องหนของคุณเอง เลือกวัสดุ สี และอุปกรณ์อย่างอิสระ
      </p>
      <button class="bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 transition">
        เริ่มออกแบบ
      </button>
    </div>
    <img src="https://source.unsplash.com/800x600/?luxury,leather,book"
         class="rounded-2xl shadow-xl w-full object-cover" />
  </div>
</section>

<!-- Main Layout -->
<div class="max-w-7xl mx-auto px-6 py-10 grid lg:grid-cols-3 gap-8">

  <!-- LEFT COLUMN -->
  <div class="lg:col-span-2 space-y-8">

    <!-- SafetyBook -->
    <div class="card p-6">
      <h3 class="text-lg font-semibold mb-4 text-slate-800">
        วัสดุภายนอก
      </h3>
      <img src="https://source.unsplash.com/600x400/?leather,texture"
           class="rounded-xl mb-4 w-full object-cover h-48" />
      <!-- Dropdown placeholder -->
      <select class="w-full border rounded-xl p-3"></select>
    </div>

    <!-- Inside -->
    <div class="card p-6">
      <h3 class="text-lg font-semibold mb-4 text-slate-800">
        วัสดุภายใน
      </h3>
      <img src="https://source.unsplash.com/600x400/?fabric,velvet"
           class="rounded-xl mb-4 w-full object-cover h-48" />
      <select class="w-full border rounded-xl p-3"></select>
    </div>

    <!-- Device -->
    <div class="card p-6">
      <h3 class="text-lg font-semibold mb-4 text-slate-800">
        เลือกอุปกรณ์
      </h3>
      <img src="https://source.unsplash.com/600x400/?smartphone,technology"
           class="rounded-xl mb-4 w-full object-cover h-48" />
      <select class="w-full border rounded-xl p-3 mb-4"></select>
      <select class="w-full border rounded-xl p-3"></select>
    </div>

  </div>

  <!-- RIGHT COLUMN SUMMARY -->
  <div class="card p-6 h-fit sticky top-24">

    <h3 class="text-lg font-semibold text-slate-800 mb-4">
      สรุปรายการ
    </h3>

    <div id="summaryBox" class="text-sm text-slate-600 space-y-2 mb-6">
      <!-- JS will render here -->
    </div>

    <div class="border-t pt-4">
      <div class="flex justify-between text-sm text-slate-600 mb-2">
        <span>ราคารวม</span>
        <span id="sellTotal" class="font-semibold text-slate-800">
          ฿0
        </span>
      </div>
    </div>

    <button id="btnNext"
      class="mt-6 w-full bg-blue-600 text-white py-3 rounded-xl hover:bg-blue-700 transition">
      ดำเนินการต่อ
    </button>

  </div>

</div>

<!-- Footer -->
<footer class="bg-white mt-16 py-6 text-center text-sm text-slate-500">
  © 2026 Stealth Safety Bank System
</footer>

<script type="module" src="configurator.js"></script>

</body>
</html>
