<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Admin Agent | SSBMS</title>

  <link rel="icon" href="images/logo.png"/>
  <link rel="stylesheet" href="css/admin-agent.css"/>
</head>

<body>

<div class="admin-page">

  <!-- Sidebar -->
  <aside class="admin-sidebar">

    <div class="brand">
      <img src="images/logo.png"/>
      <div>
        <strong>SSBMS</strong>
        <span>Admin System</span>
      </div>
    </div>

    <nav>
      <a href="admin-dashboard.html">Dashboard</a>
      <a class="active" href="admin-agent.html">ตรวจตัวแทน</a>
      <a href="admin-agents-list.html">รายชื่อตัวแทน</a>
      <a href="admin-bonus.html">โบนัส</a>
      <a href="admin-withdraw.html">ถอนเงิน</a>
    </nav>

  </aside>

  <!-- Main -->
  <main class="admin-main">

    <div class="admin-head">
      <h1>ตรวจสอบและอนุมัติตัวแทน</h1>
      <p>Admin ตรวจข้อมูล / Owner อนุมัติสุดท้าย</p>
    </div>

    <div class="form-card">

      <h2>Agent Profile Form</h2>

      <div class="form-grid">

        <div class="form-group">
          <label>ชื่อ</label>
          <input type="text" value="รัตนชัย">
        </div>

        <div class="form-group">
          <label>นามสกุล</label>
          <input type="text" value="คำช่วง">
        </div>

        <div class="form-group">
          <label>อายุ</label>
          <input type="text" value="35">
        </div>

        <div class="form-group">
          <label>เบอร์โทร</label>
          <input type="text" value="064-951-4888">
        </div>

        <div class="form-group">
          <label>อีเมล</label>
          <input type="text" value="mysiamtham@gmail.com">
        </div>

        <div class="form-group">
          <label>LINE</label>
          <input type="text" value="@siamtham">
        </div>

        <div class="form-group">
          <label>Facebook</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>Tiktok</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>YouTube</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>เลขบัญชี</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>รหัสตัวแทน</label>
          <input type="text" value="AGT-0001">
        </div>

        <div class="form-group">
          <label>Team Manager</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>AM</label>
          <input type="text">
        </div>

        <div class="form-group">
          <label>สถานะ</label>

          <select>
            <option>INCOMPLETE</option>
            <option>APPROVED</option>
            <option>SUSPENDED</option>
            <option>REJECTED</option>
          </select>
        </div>

        <div class="form-group full">
          <label>ที่อยู่</label>
          <textarea></textarea>
        </div>

        <div class="form-group full">
          <label>รูปถ่าย</label>

          <div class="upload-box">
            <input type="file">
          </div>
        </div>

      </div>

      <div class="action-row">
        <button class="btn suspend">พักบัญชี</button>
        <button class="btn approve">อนุมัติ</button>
        <button class="btn reject">ไม่อนุมัติ</button>
      </div>

    </div>

  </main>

</div>

<script src="js/admin-guard.js"></script>

</body>
</html>
