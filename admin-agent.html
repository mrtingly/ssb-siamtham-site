<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Agent | SSBMS</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/admin-agent.css" />
</head>

<body>
  <div class="admin-page">

    <aside class="admin-sidebar">
      <img src="images/logo.png" alt="SSB Logo" />
      <h2>Admin Panel</h2>
      <a class="active">Agent Approval</a>
      <a>Agent Data</a>
      <a>Bonus</a>
      <a>Withdraw</a>
      <a>Tax</a>
      <a href="agent-dashboard.html">Dashboard</a>
    </aside>

    <main class="admin-main">
      <header>
        <h1>ตรวจสอบและอนุมัติตัวแทน</h1>
        <p>Admin ตรวจข้อมูล / Owner อนุมัติขั้นสุดท้าย</p>
      </header>

      <section class="admin-card">
        <h2>Agent Profile Form</h2>

        <form class="admin-form">
          <div class="form-grid">
            <label>ชื่อ <input type="text" value="รัตนชัย" required /></label>
            <label>นามสกุล <input type="text" value="คำช่วง" required /></label>
            <label>อายุ <input type="number" value="35" required /></label>
            <label>เบอร์โทร <input type="tel" value="064-951-4888" required /></label>
            <label>อีเมล <input type="email" value="mysiamtham@gmail.com" required /></label>
            <label>LINE <input type="text" value="@siamtham" required /></label>
            <label>Facebook <input type="text" required /></label>
            <label>TikTok <input type="text" required /></label>
            <label>YouTube <input type="text" required /></label>
            <label>เลขบัญชี <input type="text" required /></label>
            <label>รหัสตัวแทน <input type="text" value="AGT-0001" required /></label>
            <label>Team Manager <input type="text" required /></label>
            <label>AM <input type="text" required /></label>
            <label>สถานะ
              <select>
                <option>INCOMPLETE</option>
                <option>PENDING</option>
                <option>APPROVED</option>
                <option>REJECTED</option>
                <option>SUSPENDED</option>
              </select>
            </label>
          </div>

          <label class="full">ที่อยู่
            <textarea rows="4" required></textarea>
          </label>

          <label class="full">รูปถ่าย
            <input type="file" accept="image/*" required />
          </label>

          <div class="action-row">
            <button type="button" class="save-btn">บันทึกข้อมูล</button>
           <button type="button" class="approve-btn" onclick="approveAgent('AGT-0001')">
             อนุมัติ
          </button>
            <button type="button" class="reject-btn" onclick="rejectAgent('AGT-0001')">
            ไม่อนุมัติ
          </button>
          </div>
        </form>
      </section>
    </main>

  </div>

<script src="js/admin-actions.js"></script>
  
</body>
</html>
