<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Stealth Safety Bank Mobile System | Siam Tham Co.,Ltd.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/ssb-system.css?v=4" />
  <link rel="stylesheet" href="css/ssb-system-mobile.css?v=5" media="screen and (max-width: 760px), screen and (max-width: 1024px) and (orientation: portrait)" />
</head>
<body>
  <main class="ssb-page">
    <section class="ssb-page-shell">

      <div class="ssb-top-wrap">
        <div class="popup-kicker notranslate" id="ssbKicker">SSB Mobile System</div>

        <div class="ssb-top-layout">
          <div class="ssb-top-video">
            <div class="popup-pro-video-frame ssb-main-video">
              <iframe
                id="ssbVideo"
                src=""
                title="SSB Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>
            </div>

            <div class="video-note notranslate" id="ssbVideoNote"></div>
          </div>

          <div class="ssb-top-side">
            <nav class="popup-pro-nav notranslate ssb-nav-fixed" id="ssbNav"></nav>
          </div>
        </div>
      </div>

      <section class="ssb-page-content" id="ssbPageContent">
        <div class="popup-pro-head">
          <h3 id="ssbTitle" class="notranslate"></h3>
          <div class="popup-subtitle notranslate" id="ssbSubtitle"></div>
        </div>

        <div class="popup-pro-body">
          <div class="popup-panel popup-pro-intro">
            <h4 class="popup-section-title"><span class="dot"></span>ภาพรวม</h4>
            <p class="popup-lead notranslate" id="ssbLead"></p>
            <div class="badge-row notranslate" id="ssbBadges"></div>
          </div>

          <div class="popup-pro-grid">
            <div class="popup-panel">
              <h4 class="popup-section-title"><span class="dot"></span>คุณสมบัติเด่น</h4>
              <ul class="feature-list notranslate" id="ssbFeatures"></ul>
            </div>

            <div class="popup-panel">
              <h4 class="popup-section-title"><span class="dot"></span>เหมาะกับใคร</h4>
              <ul class="feature-list notranslate" id="ssbUseCases"></ul>
            </div>
          </div>

          <div class="popup-panel">
            <h4 class="popup-section-title"><span class="dot"></span>ผลลัพธ์ของระบบ</h4>
            <div class="impact-grid notranslate" id="ssbImpacts"></div>
          </div>

          <div class="popup-panel popup-pro-rule-panel">
            <div class="popup-pro-rule-title notranslate">กฎสำคัญ</div>
            <div class="popup-pro-rule-box" id="ssbRules"></div>
          </div>

          <div class="popup-action-row" id="ssbActions"></div>
        </div>
      </section>

    </section>
  </main>

  <script src="js/ssb-system-data.js?v=4"></script>
  <script src="js/ssb-system-page.js?v=4"></script>
</body>
</html>
