<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stealth Safety Bank System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/ssb-system.css" />
  <link rel="stylesheet" href="css/ssb-system-mobile.css" />
</head>
<body class="light-mode">

  <main class="ssb-page">
    <section class="ssb-page-shell">

      <aside class="ssb-page-media">
        <div class="ssb-page-video-sticky">
          <div class="popup-kicker" id="ssbKicker"></div>

          <div class="popup-pro-nav" id="ssbNav"></div>

          <div class="popup-pro-video-frame">
            <iframe
              id="ssbVideo"
              src=""
              title="SSB Video"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>

          <div class="video-note" id="ssbVideoNote"></div>
        </div>
      </aside>

      <section class="ssb-page-content" id="ssbPageContent">
        <div class="popup-pro-head">
          <h3 id="ssbTitle"></h3>
          <div class="popup-subtitle" id="ssbSubtitle"></div>
        </div>

        <div class="popup-pro-body">
          <div class="popup-panel popup-pro-intro">
            <p class="popup-lead" id="ssbLead"></p>
            <div class="badge-row" id="ssbBadges"></div>
          </div>

          <div class="popup-pro-grid">
            <div class="popup-panel">
              <h4 class="popup-section-title"><span class="dot"></span>คุณสมบัติเด่น</h4>
              <ul class="feature-list" id="ssbFeatures"></ul>
            </div>

            <div class="popup-panel">
              <h4 class="popup-section-title"><span class="dot"></span>เหมาะกับใคร</h4>
              <ul class="feature-list" id="ssbUseCases"></ul>
            </div>
          </div>

          <div class="popup-panel">
            <h4 class="popup-section-title"><span class="dot"></span>ผลลัพธ์ของระบบ</h4>
            <div class="impact-grid" id="ssbImpacts"></div>
          </div>

          <div class="popup-panel popup-pro-rule-panel">
            <div class="popup-pro-rule-title">กฎสำคัญ</div>
            <div class="popup-pro-rule-box" id="ssbRules"></div>
          </div>

          <div class="popup-action-row" id="ssbActions"></div>
        </div>
      </section>

    </section>
  </main>

  <script src="js/ssb-system-data.js"></script>
  <script src="js/ssb-system-page.js"></script>
</body>
</html>
