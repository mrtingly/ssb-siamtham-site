<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Stealth Safety Bank Mobile System | Siam Tham Co.,Ltd.</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=Orbitron:wght@500;600;700;800;900&display=swap" rel="stylesheet"/>

  <!-- THEME -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme");
      const isLight = savedTheme === "light";
      document.documentElement.classList.toggle("light-mode", isLight);
      document.documentElement.classList.toggle("dark-mode", !isLight);
    })();
  </script>

  <!-- 🔵 CORE CSS (จาก index) -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- 🟢 SSB CSS -->
  <link rel="stylesheet" href="css/ssb-system.css?v=40">
  <link rel="stylesheet" href="css/ssb-system-logo.css">
  <link rel="stylesheet" href="css/ssb-system-icons.css">
  <link rel="stylesheet" href="css/ssb-system-detail.css">
  <link rel="stylesheet" href="css/ssb-system-effects.css">
  <link rel="stylesheet" href="css/ssb-system-footer.css">
  <link rel="stylesheet" href="css/ssb-system-responsive.css">
  <link rel="stylesheet" href="css/ssb-system-mobile.css?v=40" media="(max-width:1023px)">
</head>

<body>
<div class="site-wrap">

  <!-- ✅ HEADER (ใช้ของ index 100%) -->
  <header class="ssb-topbar" role="banner">
    <div class="topbar-inner">

      <div class="brand-wrap">
        <div class="brand-logo">
          <img src="images/logo.png" alt="logo">
        </div>
        <div class="brand-text">
          <div class="brand-line-1">บริษัท สยามทำ จำกัด</div>
          <div class="brand-line-2">Siam Tham Co.,Ltd.</div>
          <div class="brand-site">
            <a href="https://www.siamtham.com">www.siamtham.com</a>
          </div>
        </div>
      </div>

      <div class="header-search-wrap">
        <form class="header-search" id="agentSearchForm">
          <input class="header-search-input" placeholder="ค้นหาตัวแทน / Search agent">
          <button class="header-search-btn">ค้นหา</button>
        </form>
      </div>

      <div class="topbar-actions">
        <div class="theme-switch-wrap">
          <span class="mode-label">Dark</span>
          <button id="themeToggle" class="theme-switch">
            <span class="switch-knob"></span>
          </button>
          <span class="mode-label">Light</span>
        </div>

        <div class="lang-bar">
          <button class="lang-btn active">
            <img src="https://flagcdn.com/w40/th.png">
          </button>
          <button class="lang-btn">
            <img src="https://flagcdn.com/w40/us.png">
          </button>
        </div>
      </div>

    </div>
  </header>

  <!-- CONTENT -->
  <main class="main-content">
    <section class="hero-card">
      <div class="hero-head">
        <div class="hero-kicker">SSB Mobile System</div>
        <h1>STEALTH SAFETY BANK MOBILE SYSTEM</h1>
        <p>กดโลโก้เพื่อเริ่มระบบ</p>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="ssb-footer">
    <div class="footer-shell">
      <div class="footer-copy">
        <div>@ Stealth Safety Bank Mobile System</div>
        <div>BY Siam Tham</div>
      </div>
    </div>
  </footer>

</div>

<!-- JS -->
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/popup.js"></script>
<script src="js/main.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
