<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Login | SSBMS</title>

  <link rel="stylesheet" href="css/agent-login.css" />
</head>

<body>

  <main class="login-page">
    <section class="login-card">

      <h1>Agent Login</h1>
      <p>เข้าสู่ระบบตัวแทน</p>

      <!-- ✅ FORM -->
      <form class="login-form" onsubmit="doLogin(event)">

        <input 
          id="username"
          type="text" 
          placeholder="Agent ID หรือ Email" 
          required 
        />

        <input 
          id="password"
          type="password" 
          placeholder="Password" 
          required 
        />

        <button type="submit">เข้าสู่ระบบ</button>

      </form>

      <a href="agent-register.html" class="register-link">
        สมัครตัวแทน
      </a>

    </section>
  </main>

  <script src="js/logout.js"></script>
  <script src="js/agent-guard.js"></script>

</body>
</html>
