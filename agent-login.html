<!DOCTYPE html>
<html lang="th" class="sbos-auth-page" data-i18n-page-title="login.pageTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>เข้าสู่ระบบตัวแทน | SSBMS</title>

  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/agent-login.css" />
  <link rel="stylesheet" href="css/sbos-typography.css" />
  <link rel="stylesheet" href="css/sbos-theme.css" />
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-switch">
        <a class="active" href="agent-login.html" data-i18n="common.agent">AGENT</a>
        <a href="admin-login.html" data-i18n="common.admin">ADMIN</a>
      </div>

      <div class="sbos-lang-switch" aria-label="เลือกภาษา" data-i18n-aria-label="common.language.switchLabel">
        <button class="sbos-lang-btn" type="button" data-sbos-lang="th" data-i18n-aria-label="common.language.thLabel">TH</button>
        <button class="sbos-lang-btn" type="button" data-sbos-lang="en" data-i18n-aria-label="common.language.enLabel">EN</button>
        <button class="sbos-theme-btn" type="button" data-sbos-theme-option="light" data-i18n="theme.light" data-i18n-aria-label="theme.lightLabel" aria-label="Use light mode">Light</button>
        <button class="sbos-theme-btn" type="button" data-sbos-theme-option="dark" data-i18n="theme.dark" data-i18n-aria-label="theme.darkLabel" aria-label="Use dark mode">Dark</button>
      </div>

      <img
        src="images/logo.png"
        class="login-logo"
        alt="SSBMS Logo"
      />

      <h1 data-i18n="login.title">Agent Login</h1>
      <p data-i18n="login.subtitle">เข้าสู่ระบบตัวแทน</p>

      <form class="login-form" onsubmit="doLogin(event)">

        <label for="username">
          <span data-i18n="login.usernameLabel">Agent ID หรือ Email</span>
          <input
            id="username"
            type="text"
            placeholder="Agent ID หรือ Email"
            data-i18n-placeholder="login.usernamePlaceholder"
            required
          />
        </label>

        <label for="password">
          <span data-i18n="login.passwordLabel">รหัสผ่าน</span>
        </label>

        <div class="password-wrap">

          <input
            id="password"
            type="password"
            placeholder="Password"
            data-i18n-placeholder="login.passwordPlaceholder"
            required
          />

          <button
            type="button"
            class="show-pass-btn"
            onclick="togglePassword()"
            aria-label="แสดงหรือซ่อนรหัสผ่าน"
            data-i18n-aria-label="login.togglePassword"
          >
            👁
          </button>

        </div>

        <button type="submit" data-i18n="login.submit" aria-label="เข้าสู่ระบบตัวแทน" data-i18n-aria-label="login.submitLabel">
          เข้าสู่ระบบ
        </button>

      </form>

      <a href="agent-register.html" class="register-link" data-i18n="login.registerLink">
        สมัครตัวแทน
      </a>

    </section>

  </main>

  <script>
    (function () {
      const KEY = "sbos_theme";
      const OPTIONS = ["light", "dark"];
      function normalize(value) { const next = String(value || "").toLowerCase(); return OPTIONS.indexOf(next) !== -1 ? next : "light"; }
      function preferredTheme() { try { const stored = localStorage.getItem(KEY); if (stored) return normalize(stored); } catch (error) {} return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
      function apply(theme) { const next = normalize(theme || preferredTheme()); document.documentElement.setAttribute("data-sbos-theme", next); document.querySelectorAll("[data-sbos-theme-option]").forEach(function (button) { button.setAttribute("aria-pressed", button.getAttribute("data-sbos-theme-option") === next ? "true" : "false"); }); return next; }
      window.SBOSTheme = { apply: apply, getTheme: function () { return document.documentElement.getAttribute("data-sbos-theme") || apply(); }, setTheme: function (theme) { const next = apply(theme); try { localStorage.setItem(KEY, next); } catch (error) {} return next; } };
      document.addEventListener("DOMContentLoaded", function () { apply(); document.querySelectorAll("[data-sbos-theme-option]").forEach(function (button) { button.addEventListener("click", function () { window.SBOSTheme.setTheme(button.getAttribute("data-sbos-theme-option")); }); }); }, { once: true });
      apply(preferredTheme());
    })();
  </script>
  <script src="js/i18n.js"></script>
  <script src="js/login.js?v=20260726-2"></script>

</body>
</html>
