<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Agent Login | SSBMS</title>

  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/agent-login.css" />
</head>

<body>

  <main class="login-page">

    <section class="login-card">

      <div class="login-switch">
        <a class="active" href="agent-login.html">AGENT</a>
        <a href="admin-login.html">ADMIN</a>
      </div>

      <img 
        src="images/logo.png" 
        class="login-logo"
        alt="SSBMS Logo"
      />

      <h1>Agent Login</h1>
      <p>เข้าสู่ระบบตัวแทน</p>

      <form class="login-form" onsubmit="doLogin(event)">

        <input 
          id="username"
          type="text"
          placeholder="Agent ID หรือ Email"
          required
        />

        <div class="password-wrap">

          <input 
            id="password"
            type="password"
            placeholder="Password"
            required
          />

          <button
            type="button"
            class="show-pass-btn"
            onclick="togglePassword()"
          >
            👁
          </button>

        </div>

        <button type="submit">
          เข้าสู่ระบบ
        </button>

      </form>

      <a href="agent-register.html" class="register-link">
        สมัครตัวแทน
      </a>

    </section>

  </main>

  <script src="js/login.js?v=20260726-2"></script>

</body>
</html>
