<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Login | SSBMS</title>
  <link rel="icon" href="images/logo.png" />
  <link rel="stylesheet" href="css/agent-login.css" />
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <img src="images/logo.png" class="login-logo" alt="SSB Logo" />

      <h1>Agent Login</h1>
      <p>เข้าสู่ระบบตัวแทน Stealth Safety Bank</p>

      <form class="login-form" action="agent-dashboard.html">
        <label>
          รหัสตัวแทน / อีเมล
          <input type="text" required placeholder="AGT-0001 หรือ Email" />
        </label>

        <label>
          รหัสผ่าน
          <input type="password" required placeholder="Password" />
        </label>

        <button type="submit">เข้าสู่ระบบ</button>
      </form>

      <a href="agent-register.html" class="register-link">สมัครเป็นตัวแทน</a>
    </section>
  </main>
</body>
</html>
