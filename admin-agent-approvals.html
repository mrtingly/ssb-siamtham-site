<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>อนุมัติตัวแทน | SBOS Admin</title><link rel="icon" href="images/logo.png"><style>:root{--navy:#071a36;--blue:#176bdc;--bg:#f5f8fc;--card:#fff;--text:#15243a;--muted:#728097;--line:#e3eaf3;--green:#14845c;--red:#b42318;--shadow:0 16px 42px rgba(20,49,83,.09)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none;color:inherit}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px}.brand img{width:40px;height:40px;object-fit:contain}.brand small{display:block;color:var(--muted)}.back{padding:10px 14px;border:1px solid var(--line);border-radius:12px;color:var(--blue);font-weight:800}.page{width:min(calc(100% - 24px),1400px);margin:24px auto 60px}.hero{padding:26px;border-radius:26px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;box-shadow:var(--shadow)}.hero h1{margin:0;font-size:clamp(1.8rem,4vw,3.2rem)}.hero p{margin:8px 0 0;color:#dbeafe}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:17px 0}.stat,.panel{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.stat{padding:17px;border-radius:19px}.stat span{color:var(--muted);font-size:.76rem}.stat strong{display:block;font-size:1.7rem;margin-top:7px}.panel{border-radius:22px;overflow:hidden}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:15px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{height:43px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff}.toolbar input{flex:1;min-width:240px}.list{display:grid}.row{display:grid;grid-template-columns:1.2fr 1fr .75fr .75fr 1fr;gap:13px;align-items:center;padding:17px;border-bottom:1px solid var(--line);font-size:.78rem}.row:last-child{border:0}.row b{display:block;font-size:.86rem}.row small{display:block;color:var(--muted);margin-top:4px}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff6df;color:#8b5a00;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.approve{background:#e8f7ef;color:var(--green)}.reject{background:#fff0ef;color:var(--red)}.empty,.loading{padding:48px 20px;text-align:center;color:var(--muted)}.message{display:none;margin-bottom:14px;padding:13px;border-radius:13px}.message.show{display:block}.message.error{background:#fff0ef;color:var(--red)}.message.ok{background:#e8f7ef;color:var(--green)}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:580px){.stats,.row{grid-template-columns:1fr}.page{width:calc(100% - 12px)}.top{padding:0 10px}.brand small{display:none}}</style></head><body><header class="top"><div class="brand"><img src="images/logo.png" alt="SSBMS"><div><b>SBOS Admin</b><small>บริษัท สยามทำ จำกัด</small></div></div><a class="back" href="admin-dashboard.html">กลับ Dashboard</a></header><main class="page"><section class="hero"><h1>ศูนย์อนุมัติตัวแทน</h1><p>ตรวจผู้สมัครที่อบรมครบและสอบผ่าน ก่อนเปิดสิทธิ์ Dashboard ตัวแทน</p></section><section class="stats"><div class="stat"><span>รออนุมัติ</span><strong id="pendingCount">0</strong></div><div class="stat"><span>สอบผ่าน</span><strong id="passedCount">0</strong></div><div class="stat"><span>อนุมัติแล้ว</span><strong id="approvedCount">0</strong></div><div class="stat"><span>ไม่อนุมัติ</span><strong id="rejectedCount">0</strong></div></section><div id="message" class="message"></div><section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="ค้นหารหัส ชื่อ อีเมล หรือเบอร์โทร"><select id="filter"><option value="WAIT_APPROVAL">รออนุมัติ</option><option value="ALL">ทุกสถานะ</option><option value="APPROVED">อนุมัติแล้ว</option><option value="REJECTED">ไม่อนุมัติ</option></select><button class="btn" id="refreshBtn">รีเฟรช</button></div><div id="list" class="list"><div class="loading">กำลังโหลดข้อมูล...</div></div></section></main><script src="js/sbos-api.js"></script><script src="js/sbos-agent-onboarding.js"></script><script>let records=[];const $=s=>document.querySelector(s);const statusOf=a=>String(a.status||a.agent_status||'WAIT_APPROVAL').toUpperCase();function show(text,type='ok'){const box=$('#message');box.textContent=text;box.className='message show '+type;setTimeout(()=>box.className='message',3500)}function normalize(data){const raw=data?.agents||data?.items||data?.data||data||[];return Array.isArray(raw)?raw:[]}async function load(){try{$('#list').innerHTML='<div class="loading">กำลังโหลดข้อมูล...</div>';const data=await SBOS_API.agents.list($('#filter').value==='ALL'?'':$('#filter').value);records=normalize(data);if(!records.length&&window.SBOSAgent)records=SBOSAgent.all();render()}catch(err){records=window.SBOSAgent?SBOSAgent.all():[];render();show('ไม่สามารถโหลดจากเซิร์ฟเวอร์ จึงแสดงข้อมูลสำรองในเครื่อง: '+err.message,'error')}}function render(){const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;const filtered=records.filter(a=>{const s=statusOf(a),text=[a.agent_id,a.agentId,a.id,a.name,a.fullName,a.email,a.phone].filter(Boolean).join(' ').toLowerCase();return(f==='ALL'||s===f)&&(!q||text.includes(q))});$('#pendingCount').textContent=records.filter(a=>['WAIT_APPROVAL','PENDING'].includes(statusOf(a))).length;$('#passedCount').textContent=records.filter(a=>a.exam_passed===true||a.examPassed===true||Number(a.exam_score||a.examScore)>=80).length;$('#approvedCount').textContent=records.filter(a=>statusOf(a)==='APPROVED').length;$('#rejectedCount').textContent=records.filter(a=>statusOf(a)==='REJECTED').length;if(!filtered.length){$('#list').innerHTML='<div class="empty">ไม่พบตัวแทนตามเงื่อนไขที่เลือก</div>';return}$('#list').innerHTML=filtered.map(a=>{const id=a.agent_id||a.agentId||a.id||'';const name=a.name||a.fullName||[a.first_name,a.last_name].filter(Boolean).join(' ')||'-';const score=Number(a.exam_score||a.examScore||0);const s=statusOf(a);return `<article class="row"><div><b>${name}</b><small>${id||'-'} · ${a.email||'-'}</small></div><div><b>${a.phone||'-'}</b><small>แม่ทีม: ${a.team_manager||a.teamCode||'-'}</small></div><div><b>${score}%</b><small>คะแนนสอบ</small></div><div><span class="badge">${s}</span></div><div class="actions">${['WAIT_APPROVAL','PENDING'].includes(s)?`<button class="btn approve" data-action="approve" data-id="${id}">อนุมัติ</button><button class="btn reject" data-action="reject" data-id="${id}">ไม่อนุมัติ</button>`:'-'}</div></article>`}).join('')}async function act(action,id){if(!id)return;const label=action==='approve'?'อนุมัติ':'ไม่อนุมัติ';if(!confirm(`${label}ตัวแทน ${id} ใช่หรือไม่`))return;try{if(action==='approve')await SBOS_API.agents.approve({agentId:id,approvedBy:'SBOS Admin'});else await SBOS_API.agents.reject({agentId:id,rejectedBy:'SBOS Admin'});show(label+'เรียบร้อย');await load()}catch(err){try{if(window.SBOSAgent){action==='approve'?SBOSAgent.approve(id,'SBOS Admin'):SBOSAgent.reject(id,'SBOS Admin');show(label+'ในข้อมูลสำรองเรียบร้อย');await load();return}}catch{}show(err.message||'ดำเนินการไม่สำเร็จ','error')}}$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action,b.dataset.id)});$('#search').addEventListener('input',render);$('#filter').addEventListener('change',load);$('#refreshBtn').addEventListener('click',load);load();</script></body></html>
