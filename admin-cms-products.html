<!DOCTYPE html>
<!-- SBOS V3-5 marker: Product content CMS, separate from pricing engine. -->
<html lang="th">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SBOS CMS Products</title><link rel="icon" href="images/logo.png" /><link rel="stylesheet" href="css/sbos-typography.css" /><link rel="stylesheet" href="css/sbos-cms.css" /></head>
<body data-cms-page="content" data-cms-type="PRODUCT_CONTENT">
  <div class="cms-shell"><aside class="cms-side"><div class="cms-brand"><img src="images/logo.png" alt="Siamtham" /><div><strong>SBOS CMS</strong><span>Product Content</span></div></div><nav class="cms-menu" aria-label="CMS navigation"><a href="admin-cms.html">Dashboard</a><a class="active" href="admin-cms-products.html">Products</a><a href="admin-cms-product-edit.html">Product Edit</a><a href="admin-cms-collections.html">Collections</a><a href="admin-cms-promotions.html">Promotions</a></nav></aside><main class="cms-main"><header class="cms-top"><div><h1>Product Content</h1><p>Marketing copy and media only. Product/Pricing remains authoritative.</p></div><button id="refreshButton" class="cms-btn" type="button">Refresh</button></header><section class="cms-content">
    <form id="cmsContentForm" class="cms-form"><input type="hidden" name="content_type" value="PRODUCT_CONTENT" /><label>Key<input name="content_key" required /></label><label>Product ID<input name="related_entity_id" required /></label><input type="hidden" name="related_entity_type" value="PRODUCT" /><label>Locale<select name="locale"><option value="th">th</option><option value="en">en</option></select></label><label>Price Policy<select name="price_display_policy"><option>CHECK_CURRENT_PRICE</option><option>SHOW_PRICE</option><option>HIDE_PRICE</option><option>CONTACT_FOR_PRICE</option><option>STARTING_FROM</option><option>TEMPORARILY_UNAVAILABLE</option></select></label><label class="wide">Title<input name="title" required /></label><label class="wide">Summary<textarea name="summary"></textarea></label><label class="wide">Body<textarea name="body"></textarea></label><label>CTA Label<input name="cta_label" /></label><label>CTA URL<input name="cta_url" value="agent-products.html" /></label><label>Order<input name="display_order" type="number" value="10" /></label><label>Metadata JSON<textarea name="metadata_json">{}</textarea></label><button class="cms-btn" type="submit">Save Draft</button></form>
    <section class="cms-panel"><h3>Product Content</h3><div class="cms-table-wrap"><table class="cms-table"><thead><tr><th>ID</th><th>Type</th><th>Title</th><th>Slug</th><th>Status</th><th>Actions</th></tr></thead><tbody id="contentRows"></tbody></table></div></section>
  </section></main></div><div id="cmsToast" class="cms-toast" role="status" aria-live="polite"></div><script src="js/admin-guard.js"></script><script src="js/sbos-api-config.js"></script><script src="js/sbos-cms-admin.js"></script></body></html>
