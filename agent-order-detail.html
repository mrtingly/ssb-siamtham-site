<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายละเอียดคำสั่งซื้อ | SSB Agent</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="css/sbos-core.css"><style>body{background:#f5f7fa}.page{width:min(calc(100% - 20px),1050px);margin:28px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:24px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid #edf0f3;padding-bottom:18px}.head h1{margin:0;font-size:2rem}.badge{padding:7px 11px;border-radius:999px;background:#eef6ff;color:#0066cc;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.box{padding:17px;border:1px solid #e5e7eb;border-radius:17px;background:#fbfcfd}.box h3{margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #edf0f3}.row:last-child{border:0}.timeline{margin-top:18px}.step{padding:12px 0 12px 22px;border-left:3px solid #cfe5fb;position:relative}.step:before{content:'';position:absolute;left:-8px;top:18px;width:12px;height:12px;border-radius:50%;background:#0672ce}.back{display:inline-block;margin-bottom:14px;color:#0672ce;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{flex-direction:column}}</style></head><body><main class="page"><a class="back" href="agent-orders.html">← กลับคำสั่งซื้อ</a><section class="card" id="card"></section></main><script>const params=new URLSearchParams(location.search),id=params.get('id');const orders=JSON.parse(localStorage.getItem('ssb_orders')||'[]');const o=orders.find(x=>x.orderId===id);const money=v=>'฿'+Number(v||0).toLocaleString('th-TH');const labels={waiting_payment:'รอชำระเงิน',approved:'อนุมัติแล้ว',installing:'กำลังติดตั้ง',shipping:'กำลังจัดส่ง',completed:'ส่งมอบแล้ว',cancelled:'ยกเลิก'};if(!o){document.getElementById('card').innerHTML='<h2>ไม่พบคำสั่งซื้อ</h2>'}else{document.getElementById('card').innerHTML=`<div class="head"><div><h1>${o.orderId}</h1><p>อ้างอิง ${o.quoteId||'-'}</p></div><span class="badge">${labels[o.status]||o.status}</span></div><div class="grid"><div class="box"><h3>ลูกค้า</h3><div class="row"><span>ชื่อ</span><b>${o.customerName||o.customer?.name||'-'}</b></div><div class="row"><span>โทรศัพท์</span><b>${o.customer?.phone||'-'}</b></div><div class="row"><span>ที่อยู่</span><b>${o.customer?.address||'-'}</b></div></div><div class="box"><h3>สินค้า</h3><div class="row"><span>รุ่น</span><b>${o.model||'-'}</b></div><div class="row"><span>ความจุ</span><b>${o.storage||'-'}</b></div><div class="row"><span>สี</span><b>${o.color||'-'}</b></div><div class="row"><span>ยอดสุทธิ</span><b>${money(o.grandTotal)}</b></div></div></div><div class="timeline"><h3>ประวัติสถานะ</h3>${(o.history||[{status:o.status,at:o.updatedAt||o.createdAt}]).map(h=>`<div class="step"><b>${labels[h.status]||h.status}</b><div>${h.at?new Date(h.at).toLocaleString('th-TH'):''}</div></div>`).join('')}</div>`}</script></body></html>
