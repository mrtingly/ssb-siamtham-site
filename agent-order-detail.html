<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายละเอียดคำสั่งซื้อ | SSB Agent</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/sbos-core.css">
<style>
body{background:#f5f7fa}.page{width:min(calc(100% - 20px),1050px);margin:28px auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:24px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid #edf0f3;padding-bottom:18px}.head h1{margin:0;font-size:2rem}.badge{padding:7px 11px;border-radius:999px;background:#eef6ff;color:#0066cc;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.box{padding:17px;border:1px solid #e5e7eb;border-radius:17px;background:#fbfcfd}.box h3{margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #edf0f3}.row:last-child{border:0}.timeline{margin-top:18px}.step{padding:12px 0 12px 22px;border-left:3px solid #cfe5fb;position:relative}.step:before{content:'';position:absolute;left:-8px;top:18px;width:12px;height:12px;border-radius:50%;background:#0672ce}.back{display:inline-block;margin-bottom:14px;color:#0672ce;font-weight:800}.muted{color:#6b7280}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{flex-direction:column}}
</style>
</head>
<body>
<main class="page">
<a class="back" href="agent-orders.html">← กลับคำสั่งซื้อ</a>
<section class="card" id="card">กำลังโหลดคำสั่งซื้อ...</section>
</main>
<script>
"use strict";
const API_URL="https://script.google.com/macros/s/AKfycbyKhWE-_SuKreCPyD4tsNmqNMQz2hZ8hQtrckk92mh8rszh1jaNEeuuFBGsPOLKfAziNg/exec";
const labels={NEW:"สร้างใหม่",PAYMENT_PENDING:"รอชำระเงิน",PAYMENT_REVIEW:"รอตรวจชำระเงิน",DEPOSIT_PAID:"ชำระมัดจำแล้ว",PAID_IN_FULL:"ชำระเต็มจำนวนแล้ว",PAID:"ชำระแล้ว",PREPARING:"กำลังเตรียมสินค้า",READY_TO_INSTALL:"พร้อมติดตั้ง",INSTALLING:"กำลังติดตั้ง",COMPLETED:"ส่งมอบแล้ว",CANCELLED:"ยกเลิก"};
const money=v=>"฿"+Number(v||0).toLocaleString("th-TH");
function getAgentId(){const direct=localStorage.getItem("agent_id")||localStorage.getItem("ssb_agent_id")||localStorage.getItem("ssb_current_agent_v1");if(direct)return direct;for(const key of ["ssb_agent_session","ssb_agent_session_v1"]){try{const s=JSON.parse(localStorage.getItem(key)||"null");if(s&&(s.agent_id||s.applicationId))return s.agent_id||s.applicationId}catch(e){}}return ""}
function getAgentToken(){return localStorage.getItem("agent_session_token")||""}
async function apiGet(action,params){const query=new URLSearchParams({action,...params});const res=await fetch(API_URL+"?"+query.toString(),{cache:"no-store"});return res.json()}
async function apiPost(payload){const res=await fetch(API_URL,{method:"POST",body:JSON.stringify(payload)});const text=await res.text();try{return JSON.parse(text)}catch(e){return{ok:false,message:text||"Invalid API response"}}}
function text(el,value){el.textContent=value||"-";return el}
function addRow(parent,label,value){const row=document.createElement("div");row.className="row";text(row.appendChild(document.createElement("span")),label);text(row.appendChild(document.createElement("b")),value);parent.appendChild(row)}
function render(order,logs){const card=document.getElementById("card");card.textContent="";const head=document.createElement("div");head.className="head";const titleBox=document.createElement("div");const h1=document.createElement("h1");text(h1,order.orderId||order.order_id);const ref=document.createElement("p");ref.className="muted";text(ref,"อ้างอิง "+(order.quoteId||order.quotation_id||"-"));titleBox.append(h1,ref);const badge=document.createElement("span");badge.className="badge";text(badge,labels[order.status]||order.status);head.append(titleBox,badge);const grid=document.createElement("div");grid.className="grid";const customer=document.createElement("div");customer.className="box";customer.innerHTML="<h3>ลูกค้า</h3>";addRow(customer,"ชื่อ",order.customerName||order.customer?.name);addRow(customer,"โทรศัพท์",order.customer?.phone||order.customer_phone);addRow(customer,"อีเมล",order.customer_email);addRow(customer,"ที่อยู่",order.customer?.address||order.customer_address);const product=document.createElement("div");product.className="box";product.innerHTML="<h3>สินค้า</h3>";addRow(product,"รุ่น",order.model);addRow(product,"ความจุ",order.storage);addRow(product,"สี",order.color);addRow(product,"ยอดสุทธิ",money(order.grandTotal||order.grand_total));addRow(product,"ยอดมัดจำ",money(order.deposit_amount));addRow(product,"ยอดคงเหลือ",money(order.balance_amount));addRow(product,"ชำระแล้ว",money(order.paid_amount||order.payment_summary?.approved_amount));grid.append(customer,product);const timeline=document.createElement("div");timeline.className="timeline";const th=document.createElement("h3");text(th,"ประวัติสถานะ");timeline.appendChild(th);(logs&&logs.length?logs:order.timeline||[{to_status:order.status,created_at:order.updatedAt||order.createdAt}]).forEach(item=>{const step=document.createElement("div");step.className="step";const b=document.createElement("b");text(b,labels[item.to_status||item.status]||item.to_status||item.status);const d=document.createElement("div");const at=item.created_at||item.at;d.textContent=at?new Date(at).toLocaleString("th-TH"):"";step.append(b,d);timeline.appendChild(step)});card.append(head,grid,timeline)}
async function init(){const id=new URLSearchParams(location.search).get("id")||"";const agentId=getAgentId();if(!agentId||!getAgentToken()){location.href="agent-login.html";return}try{const data=await apiPost({action:"getOrder",order_id:id,agent_id:agentId,agent_session_token:getAgentToken()});if(!data||!data.ok)throw new Error(data&&data.message?data.message:"ไม่พบคำสั่งซื้อ");render(data.order,data.status_logs)}catch(err){const card=document.getElementById("card");card.textContent=err.message||"ไม่พบคำสั่งซื้อ"}}
init();
</script>
</body>
</html>
