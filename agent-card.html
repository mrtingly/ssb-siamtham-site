<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Agent Card</title>
<style>
body{
  background:#0b1f3a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  font-family:Prompt,sans-serif;
}

.card{
  width:320px;
  border-radius:24px;
  padding:20px;
  background:linear-gradient(180deg,#0f2b55,#0a1c35);
  color:#fff;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  position:relative;
}

.logo{
  position:absolute;
  top:16px;
  right:16px;
  font-weight:bold;
  color:#7fd8ff;
}

.profile{
  text-align:center;
  margin-top:20px;
}

.profile img{
  width:90px;
  height:90px;
  border-radius:50%;
  border:3px solid #6ddcff;
  box-shadow:0 0 15px #6ddcff;
}

.name{
  margin-top:12px;
  font-size:18px;
  font-weight:bold;
}

.id{
  color:#6ddcff;
  font-weight:bold;
}

.info{
  margin-top:14px;
  font-size:13px;
  line-height:1.6;
}

.status{
  margin-top:14px;
  text-align:center;
  font-weight:bold;
  color:#4cff9a;
}

.qr{
  margin-top:16px;
  display:flex;
  justify-content:center;
}

.qr div{
  width:90px;
  height:90px;
  background:#fff;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">SSB</div>

<div class="profile">
<img src="https://via.placeholder.com/90" />
<div class="name">รัตนชัย คำช่วง</div>
<div class="id">AGT-0001</div>
</div>

<div class="info">
📱 064-xxx-xxxx<br>
📧 email@email.com<br>
👤 Team: Manager A<br>
🌍 AM: Zone B<br>
🏦 XXX-XXX-XXXX
</div>

<div class="status">✅ APPROVED</div>

<div class="qr">
<div></div>
</div>

</div>

</body>
</html>
