<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Wallets | SBOS</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="css/sbos-typography.css"><link rel="stylesheet" href="css/sbos-finance.css"></head>
<body><div class="finance-shell"><aside class="finance-side"><div class="finance-brand"><img src="images/logo.png" alt="SBOS"><div><b>SBOS Admin</b><span>Wallet Control</span></div></div><nav class="finance-menu"><a href="admin-finance.html">Finance</a><a href="admin-commissions.html">Commissions</a><a class="active" href="admin-wallets.html">Wallets</a><a href="admin-withdraw.html">Withdrawals</a><a href="admin-commission-settings.html">Settings</a></nav></aside><main class="finance-main"><header class="finance-top"><div><h1>Wallet Accounts</h1><p>Ledger projection เป็น source of truth</p></div><button id="refresh" class="finance-action">Refresh</button></header><div class="finance-content"><section class="finance-panel"><div class="finance-toolbar"><input id="search" placeholder="Search agent or wallet"><label><input id="qa" type="checkbox"> Include QA</label></div><div class="finance-table-wrap"><table class="finance-table"><thead><tr><th>Wallet</th><th>Agent</th><th>Pending</th><th>Available</th><th>Held</th><th>Reserved</th><th>Earned</th><th>Withdrawn</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></section><section class="finance-panel"><h3>Admin Adjustment</h3><form id="form" class="finance-form"><label>Agent ID<input id="agent"></label><label>Direction<select id="direction"><option>CREDIT</option><option>DEBIT</option></select></label><label>Amount<input id="amount" inputmode="decimal"></label><label class="wide">Reason<textarea id="reason"></textarea></label><div><button class="finance-action">Create Adjustment</button></div></form></section><div id="status" class="finance-status"></div></div></main></div><script src="js/sbos-api-config.js"></script><script src="js/admin-actions.js"></script><script src="js/admin-guard.js"></script><script>"use strict";let wallets=[];function money(v){return"฿"+Number(v||0).toLocaleString("th-TH",{maximumFractionDigits:2})}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function render(){const q=search.value.toLowerCase();const rows=wallets.filter(w=>[w.wallet_id,w.agent_id].join(" ").toLowerCase().includes(q));document.getElementById("rows").innerHTML=rows.length?rows.map(w=>'<tr><td>'+esc(w.wallet_id)+'</td><td>'+esc(w.agent_id)+'</td><td>'+esc(money(w.pending_balance))+'</td><td>'+esc(money(w.available_balance))+'</td><td>'+esc(money(w.held_balance))+'</td><td>'+esc(money(w.reserved_balance))+'</td><td>'+esc(money(w.lifetime_earned))+'</td><td>'+esc(money(w.lifetime_withdrawn))+'</td></tr>').join(""):'<tr><td colspan="8" class="finance-empty">No wallets</td></tr>'}async function load(){const d=await adminPost("listWalletAccountsAdmin",{include_qa:qa.checked});if(!d.ok){status.textContent=d.message||"Load failed";return}wallets=d.wallets||[];render();status.textContent="Total "+wallets.length}form.onsubmit=async e=>{e.preventDefault();const r=await adminPost("createWalletAdjustment",{agent_id:agent.value,direction:direction.value,amount:amount.value,reason:reason.value,reference:"ADMIN_UI:"+Date.now(),idempotency_key:"ADJ_UI:"+agent.value+":"+Date.now()});if(!r.ok){alert(r.message||"Adjustment failed");return}amount.value="";reason.value="";await load()};search.oninput=render;qa.onchange=load;refresh.onclick=load;load();</script></body></html>
