<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำสั่งซื้อ | SSB Agent</title>
<link rel="icon" href="images/logo.png">
<style>
:root{--blue:#0672ce;--blue2:#004f9f;--ink:#1d1d1f;--muted:#6e6e73;--line:#e3e7ec;--bg:#f5f7fa;--green:#147a46;--amber:#955b00;--red:#b42318;--shadow:0 18px 50px rgba(18,39,66,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}button,input,select{font:inherit}
.top{position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(0,0,0,.07);background:rgba(255,255,255,.92);backdrop-filter:blur(22px)}.topin{width:min(calc(100% - 28px),1500px);height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:35px;height:35px;object-fit:contain}.brand b,.brand span{display:block}.brand span{color:var(--muted);font-size:.65rem}.nav{display:flex;gap:20px;font-size:.75rem}.nav a:hover,.nav a.active{color:var(--blue)}
.page{width:min(calc(100% - 24px),1450px);margin:28px auto 60px}.hero{padding:28px;border-radius:26px;background:linear-gradient(135deg,#05284d,#0b72ce);color:#fff;display:flex;justify-content:space-between;gap:22px;align-items:center;box-shadow:var(--shadow)}.hero h1{margin:0;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em}.hero p{margin:10px 0 0;color:#dbeafe;line-height:1.6}.primary{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 18px;background:#fff;color:var(--blue2);font-weight:800;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{padding:18px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.stat small{color:var(--muted)}.stat strong{display:block;margin-top:8px;font-size:1.8rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}.toolbar{padding:16px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #edf0f3}.toolbar input,.toolbar select{height:44px;border:1px solid #d8dde5;border-radius:12px;padding:0 12px;background:#fff;outline:none}.toolbar input{min-width:260px;flex:1}.toolbar input:focus,.toolbar select:focus{border-color:#69afe9;box-shadow:0 0 0 4px rgba(0,102,204,.08)}
.orders{display:grid}.order{padding:18px;border-bottom:1px solid #edf0f3;display:grid;grid-template-columns:1fr 1.35fr .9fr 1fr .75fr;gap:14px;align-items:center;font-size:.76rem}.order:last-child{border:0}.order b{display:block;font-size:.82rem}.order small{display:block;margin-top:5px;color:var(--muted);line-height:1.45}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:.66rem;font-weight:800}.waiting_payment,.pending_payment{background:#fff5e6;color:var(--amber)}.deposit_paid{background:#eef7ff;color:#075aab}.paid_in_full{background:#eaf8f1;color:var(--green)}.approved{background:#eaf3ff;color:#075aab}.installing{background:#eef7ff;color:#0066cc}.shipping{background:#f3efff;color:#6b38b5}.completed{background:#eaf8f1;color:var(--green)}.cancelled{background:#fff0ef;color:var(--red)}.detail{display:inline-flex;padding:9px 12px;border-radius:999px;background:#eef6ff;color:var(--blue);font-size:.69rem;font-weight:800}.empty{padding:54px 20px;text-align:center;color:var(--muted)}.empty b{display:block;margin-bottom:8px;color:var(--ink);font-size:1rem}.error{margin:16px;padding:14px;border-radius:14px;background:#fff0ef;color:var(--red);font-size:.75rem;display:none}
@media(max-width:950px){.nav{display:none}.stats{grid-template-columns:1fr 1fr}.order{grid-template-columns:1fr 1fr}.hero{align-items:flex-start;flex-direction:column}}@media(max-width:580px){.stats{grid-template-columns:1fr}.order{grid-template-columns:1fr}.page{width:calc(100% - 12px);margin-top:12px}.toolbar input,.toolbar select{width:100%;min-width:0}.topin{width:calc(100% - 18px)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="agent-dashboard.html"><img src="images/logo.png" alt="SSBMS"><div><b>SSB Agent</b><span>บริษัท สยามทำ จำกัด</span></div></a><nav class="nav"><a href="agent-dashboard.html">หน้าแรก</a><a href="agent-products.html">ผลิตภัณฑ์</a><a href="agent-quotation.html">ใบเสนอราคา</a><a class="active" href="agent-orders.html">คำสั่งซื้อ</a><a href="agent-leads.html">ลูกค้า</a><a href="agent-income.html">รายได้</a></nav></div></header>
<main class="page">
<section class="hero"><div><h1>คำสั่งซื้อของฉัน</h1><p>ติดตามสถานะตั้งแต่สำนักงานใหญ่รับเรื่อง ตรวจชำระเงิน ติดตั้ง จัดส่ง และส่งมอบ</p></div><a class="primary" href="agent-products.html">สร้างรายการใหม่</a></section>
<section class="stats"><div class="stat"><small>ทั้งหมด</small><strong id="allCount">0</strong></div><div class="stat"><small>รอดำเนินการ</small><strong id="pendingCount">0</strong></div><div class="stat"><small>กำลังติดตั้ง</small><strong id="installCount">0</strong></div><div class="stat"><small>สำเร็จแล้ว</small><strong id="completeCount">0</strong></div></section>
<section class="panel"><div class="toolbar"><input id="search" type="search" placeholder="ค้นหาเลขที่ ลูกค้า รุ่น หรือสี"><select id="filter"><option value="all">ทุกสถานะ</option><option value="waiting_payment">รอชำระเงิน/รอตรวจ</option><option value="deposit_paid">ชำระมัดจำแล้ว</option><option value="paid_in_full">ชำระเต็มจำนวนแล้ว</option><option value="approved">กำลังเตรียมงาน</option><option value="installing">กำลังติดตั้ง</option><option value="shipping">กำลังจัดส่ง</option><option value="completed">ส่งมอบแล้ว</option><option value="cancelled">ยกเลิก</option></select></div><div class="error" id="errorBox"></div><div id="orders" class="orders"></div></section>
</main>
<script>
'use strict';
const API_URL="https://script.google.com/macros/s/AKfycbyKhWE-_SuKreCPyD4tsNmqNMQz2hZ8hQtrckk92mh8rszh1jaNEeuuFBGsPOLKfAziNg/exec";
const $=s=>document.querySelector(s);
const money=v=>'฿'+Number(v||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const normalizeStatus=s=>({PAYMENT_PENDING:'waiting_payment',PAYMENT_REVIEW:'waiting_payment',DEPOSIT_PAID:'deposit_paid',PAID_IN_FULL:'paid_in_full',PAID:'paid_in_full',PREPARING:'approved',READY_TO_INSTALL:'approved',INSTALLING:'installing',COMPLETED:'completed',CANCELLED:'cancelled',pending_payment:'waiting_payment'}[String(s||'').toUpperCase()]||String(s||'waiting_payment').toLowerCase());
const statusLabel=s=>({waiting_payment:'รอชำระเงิน/รอตรวจ',deposit_paid:'ชำระมัดจำแล้ว',paid_in_full:'ชำระเต็มจำนวนแล้ว',approved:'กำลังเตรียมงาน',installing:'กำลังติดตั้ง',shipping:'กำลังจัดส่ง',completed:'ส่งมอบแล้ว',cancelled:'ยกเลิก'})[normalizeStatus(s)]||'รอดำเนินการ';
let orders=[];
const agentId=getAgentId();
function getAgentId(){const direct=localStorage.getItem('agent_id')||localStorage.getItem('ssb_agent_id')||localStorage.getItem('ssb_current_agent_v1');if(direct)return direct;for(const key of ['ssb_agent_session','ssb_agent_session_v1']){try{const s=JSON.parse(localStorage.getItem(key)||'null');if(s&&(s.agent_id||s.applicationId))return s.agent_id||s.applicationId}catch(e){}}return ''}
async function apiGet(action,params){const query=new URLSearchParams({action,...params});const res=await fetch(API_URL+'?'+query.toString(),{cache:'no-store'});return res.json()}
async function loadOrders(){if(!agentId){location.href='agent-login.html';return}$('#orders').textContent='กำลังโหลดคำสั่งซื้อ...';try{const data=await apiGet('listOrders',{agent_id:agentId});if(!data||!data.ok)throw new Error(data&&data.message?data.message:'โหลดคำสั่งซื้อไม่สำเร็จ');orders=Array.isArray(data.orders)?data.orders:[];$('#errorBox').style.display='none';render()}catch(err){orders=[];$('#errorBox').style.display='block';$('#errorBox').textContent=err.message||'โหลดคำสั่งซื้อไม่สำเร็จ';render()}}
function mine(){return orders}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=($('#search').value||'').trim().toLowerCase(),f=$('#filter').value;const owned=mine();const list=owned.filter(o=>{const text=[o.orderId,o.order_id,o.quotationId,o.quoteId,o.customerName,o.customer?.name,o.model,o.productName,o.storage,o.color].filter(Boolean).join(' ').toLowerCase();return(f==='all'||normalizeStatus(o.status)===f)&&(!q||text.includes(q))});$('#allCount').textContent=owned.length;$('#pendingCount').textContent=owned.filter(o=>['waiting_payment','approved'].includes(normalizeStatus(o.status))).length;$('#installCount').textContent=owned.filter(o=>normalizeStatus(o.status)==='installing').length;$('#completeCount').textContent=owned.filter(o=>normalizeStatus(o.status)==='completed').length;if(!list.length){$('#orders').innerHTML='<div class="empty"><b>ยังไม่มีคำสั่งซื้อในระบบ</b><span>คำสั่งซื้อจะแสดงหลังลูกค้าเซ็นใบเสนอราคาและสำนักงานใหญ่กดอนุมัติ</span></div>';return}$('#orders').innerHTML=list.slice().reverse().map(o=>{const id=o.orderId||o.order_id||'';const status=normalizeStatus(o.status);return `<article class="order"><div><b>${esc(id||'-')}</b><small>ใบเสนอราคา ${esc(o.quotationId||o.quoteId||o.quotation_id||'-')}</small></div><div><b>${esc(o.customerName||o.customer?.name||'-')}</b><small>${esc(o.model||o.productName||'-')} ${esc(o.storage||'')} ${esc(o.color||'')}</small></div><div><b>${esc(money(o.grandTotal||o.grand_total))}</b><small>ยอดรวมสุทธิ</small></div><div><span class="badge ${esc(status)}">${esc(statusLabel(status))}</span><small>${o.updatedAt||o.updated_at?esc(new Date(o.updatedAt||o.updated_at).toLocaleString('th-TH')):''}</small></div><div><a class="detail" href="agent-order-detail.html?id=${encodeURIComponent(id)}">ดูรายละเอียด</a></div></article>`}).join('')}
$('#search').addEventListener('input',render);$('#filter').addEventListener('change',render);loadOrders();
</script>
</body>
</html>
