<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>คำสั่งซื้อ | SSB Agent</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/sbos-core.css">
<style>
body{background:#f5f7fa}.page{width:min(calc(100% - 24px),1450px);margin:28px auto 60px}.hero{padding:26px;border-radius:26px;background:linear-gradient(135deg,#05284d,#0b72ce);color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:0;font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em}.hero p{margin:10px 0 0;color:#dbeafe}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat{padding:18px;border-radius:20px;background:#fff;border:1px solid #e5e7eb}.stat small{color:#6b7280}.stat strong{display:block;margin-top:8px;font-size:1.8rem}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:24px;overflow:hidden}.toolbar{padding:16px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #edf0f3}.toolbar input,.toolbar select{height:42px;border:1px solid #d8dde5;border-radius:12px;padding:0 12px}.orders{display:grid}.order{padding:18px;border-bottom:1px solid #edf0f3;display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr .9fr;gap:14px;align-items:center}.order:last-child{border:0}.order b{display:block}.order small{color:#6b7280}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:.68rem;font-weight:800}.waiting{background:#fff5e6;color:#9a5d00}.approved{background:#eaf3ff;color:#075aab}.installing{background:#eef7ff;color:#0066cc}.shipping{background:#f3efff;color:#6b38b5}.completed{background:#eaf8f1;color:#147a46}.empty{padding:50px;text-align:center;color:#6b7280}.actions a{display:inline-block;padding:8px 11px;border-radius:999px;background:#eef6ff;color:#0066cc;font-size:.7rem;font-weight:800}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.order{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar input,.toolbar select{width:100%}}@media(max-width:560px){.stats{grid-template-columns:1fr}.page{width:calc(100% - 12px)}}
</style>
</head>
<body>
<header class="sbos-top"><div class="sbos-top-inner"><a class="sbos-brand" href="agent-dashboard.html"><img src="images/logo.png" alt="SSBMS"><div><b>SSB Agent</b><span>บริษัท สยามทำ จำกัด</span></div></a><nav class="sbos-nav"><a href="agent-dashboard.html">หน้าแรก</a><a href="agent-products.html">ผลิตภัณฑ์</a><a href="agent-quotation.html">ใบเสนอราคา</a><a class="active" href="agent-orders.html">คำสั่งซื้อ</a><a href="agent-leads.html">ลูกค้า</a><a href="agent-income.html">รายได้</a></nav></div></header>
<main class="page">
<section class="hero"><div><h1>คำสั่งซื้อของฉัน</h1><p>ติดตามสถานะตั้งแต่สำนักงานใหญ่รับเรื่อง จัดเตรียม ติดตั้ง จัดส่ง และส่งมอบ</p></div><a class="sbos-btn primary" href="agent-products.html">สร้างรายการใหม่</a></section>
<section class="stats"><div class="stat"><small>ทั้งหมด</small><strong id="allCount">0</strong></div><div class="stat"><small>รอดำเนินการ</small><strong id="pendingCount">0</strong></div><div class="stat"><small>กำลังติดตั้ง</small><strong id="installCount">0</strong></div><div class="stat"><small>สำเร็จแล้ว</small><strong id="completeCount">0</strong></div></section>
<section class="panel"><div class="toolbar"><input id="search" placeholder="ค้นหาเลขที่ ลูกค้า หรือสินค้า"><select id="filter"><option value="all">ทุกสถานะ</option><option value="waiting_payment">รอชำระเงิน</option><option value="approved">อนุมัติแล้ว</option><option value="installing">กำลังติดตั้ง</option><option value="shipping">กำลังจัดส่ง</option><option value="completed">ส่งมอบแล้ว</option></select></div><div id="orders" class="orders"></div></section>
</main>
<script src="js/sbos-core.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);const money=v=>'฿'+Number(v||0).toLocaleString('th-TH');
const agentId=localStorage.getItem('agent_id')||localStorage.getItem('ssb_agent_id')||'';
let orders=JSON.parse(localStorage.getItem('ssb_orders')||'[]');
function label(s){return({waiting_payment:'รอชำระเงิน',approved:'อนุมัติแล้ว',installing:'กำลังติดตั้ง',shipping:'กำลังจัดส่ง',completed:'ส่งมอบแล้ว',cancelled:'ยกเลิก'})[s]||s||'รอดำเนินการ'}
function cls(s){return['completed','installing','shipping','approved'].includes(s)?s:'waiting'}
function mine(){return agentId?orders.filter(o=>!o.agentId||String(o.agentId)===String(agentId)):orders}
function render(){const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;const list=mine().filter(o=>(f==='all'||o.status===f)&&[o.orderId,o.quoteId,o.customerName,o.customer?.name,o.model,o.productName].join(' ').toLowerCase().includes(q));$('#allCount').textContent=mine().length;$('#pendingCount').textContent=mine().filter(o=>!['completed','cancelled','installing','shipping'].includes(o.status)).length;$('#installCount').textContent=mine().filter(o=>o.status==='installing').length;$('#completeCount').textContent=mine().filter(o=>o.status==='completed').length;if(!list.length){$('#orders').innerHTML='<div class="empty">ยังไม่มีคำสั่งซื้อในระบบ</div>';return}$('#orders').innerHTML=list.slice().reverse().map(o=>`<div class="order"><div><b>${o.orderId||'-'}</b><small>จาก ${o.quoteId||'-'}</small></div><div><b>${o.customerName||o.customer?.name||'-'}</b><small>${o.model||o.productName||'-'} ${o.storage||''} ${o.color||''}</small></div><div><b>${money(o.grandTotal)}</b><small>ยอดรวมสุทธิ</small></div><div><span class="badge ${cls(o.status)}">${label(o.status)}</span><small style="display:block;margin-top:6px">${o.updatedAt?new Date(o.updatedAt).toLocaleString('th-TH'):''}</small></div><div class="actions"><a href="agent-order-detail.html?id=${encodeURIComponent(o.orderId||'')}">ดูรายละเอียด</a></div></div>`).join('')}
$('#search').oninput=render;$('#filter').onchange=render;render();
</script>
</body>
</html>
