<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSB - เลือก Safety Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #f8fafc; }
    .card { background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(15,23,42,.06); border:1px solid #e2e8f0; }
    .input-ui { width:100%; border:1px solid #cbd5e1; border-radius:14px; padding:.9rem 1rem; background:#fff; }
    .input-ui:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,.12); }
    .btn { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border-radius:14px; padding:.95rem 1rem; font-weight:700; }
    .swatch.active { border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  </style>
</head>
<body>
  <div id="siteHeader"></div>

  <section class="bg-gradient-to-r from-blue-50 to-sky-50 border-b border-blue-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <h2 class="text-3xl font-bold text-slate-900">เลือกตัว Safety Book ให้เรียบร้อยก่อน</h2>
      <p class="text-slate-600 mt-2">เมื่อตั้งค่าครบแล้ว ให้กด Render เพื่อไปดูภาพภายนอกและภายในให้ครบทุกมุม</p>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="statusBox" class="hidden mb-6"></div>

    <div class="grid xl:grid-cols-3 gap-8">
      <div class="xl:col-span-2 space-y-8">
        <section class="card p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-4">ขนาด Safety Book</h3>
          <select id="sizeSelect" class="input-ui"></select>
        </section>

        <section class="card p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-4">วัสดุภายนอก</h3>
          <div class="grid md:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">เลือกวัสดุ</label>
              <select id="outsideMaterialSelect" class="input-ui"></select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">เลือกสี</label>
              <div id="outsideColors" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </div>
          </div>
        </section>

        <section class="card p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-4">วัสดุภายใน</h3>
          <div class="grid md:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">เลือกวัสดุ</label>
              <select id="insideMaterialSelect" class="input-ui"></select>
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">เลือกสี</label>
              <div id="insideColors" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </div>
          </div>
        </section>

        <section class="card p-6">
          <h3 class="text-xl font-bold text-slate-900 mb-4">ระบบล็อค</h3>
          <select id="lockSelect" class="input-ui"></select>
        </section>
      </div>

      <aside class="card p-6 h-fit xl:sticky xl:top-24">
        <h3 class="text-xl font-bold text-slate-900 mb-4">สรุปรายการ Safety Book</h3>
        <div id="summaryBox" class="space-y-2 text-sm text-slate-600 mb-6"></div>
        <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
          <div class="flex items-center justify-between">
            <span class="text-sm text-slate-600">ราคาขายรวม</span>
            <span id="sellTotal" class="text-xl font-bold text-slate-900">฿0</span>
          </div>
        </div>
        <button id="btnRender" class="btn w-full mt-6">Render ภาพสินค้า</button>
      </aside>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script type="module">
    import { renderSiteChrome } from "./js/layout.js";
    renderSiteChrome("Step 1 — เลือก Safety Book", "เลือกตัวสินค้า");
  </script>
  <script type="module" src="js/book.js"></script>
</body>
</html>
