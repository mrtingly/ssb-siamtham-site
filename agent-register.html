<!DOCTYPE html>
<html lang="th" data-i18n-page-title="register.pageTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครตัวแทน | SSBMS</title>

  <link rel="stylesheet" href="css/agent-login.css" />
  <link rel="stylesheet" href="css/sbos-typography.css" />
</head>

<body>

  <main class="login-page">
    <section class="login-card">

      <div class="sbos-lang-switch" aria-label="เลือกภาษา" data-i18n-aria-label="common.language.switchLabel">
        <button class="sbos-lang-btn" type="button" data-sbos-lang="th" data-i18n-aria-label="common.language.thLabel">TH</button>
        <button class="sbos-lang-btn" type="button" data-sbos-lang="en" data-i18n-aria-label="common.language.enLabel">EN</button>
      </div>

      <h1 data-i18n="register.title">สมัครตัวแทน</h1>
      <p data-i18n="register.subtitle">กรอกข้อมูลให้ครบเพื่อสมัครเป็นตัวแทน</p>

      <form class="login-form" onsubmit="submitRegister(event)">

        <label for="first_name"><span data-i18n="register.firstNameLabel">ชื่อ</span><input id="first_name" type="text" placeholder="ชื่อ" data-i18n-placeholder="register.firstNamePlaceholder" required /></label>
        <label for="last_name"><span data-i18n="register.lastNameLabel">นามสกุล</span><input id="last_name" type="text" placeholder="นามสกุล" data-i18n-placeholder="register.lastNamePlaceholder" required /></label>

        <label for="phone"><span data-i18n="register.phoneLabel">เบอร์โทรศัพท์</span><input id="phone" type="text" placeholder="เบอร์โทรศัพท์" data-i18n-placeholder="register.phonePlaceholder" required /></label>
        <label for="email"><span data-i18n="register.emailLabel">อีเมล</span><input id="email" type="email" placeholder="อีเมล" data-i18n-placeholder="register.emailPlaceholder" required /></label>
        <label for="password"><span data-i18n="register.passwordLabel">รหัสผ่าน</span><input id="password" type="password" placeholder="รหัสผ่าน" data-i18n-placeholder="register.passwordPlaceholder" required /></label>

        <label for="line"><span data-i18n="register.lineLabel">LINE</span><input id="line" type="text" placeholder="LINE" data-i18n-placeholder="register.linePlaceholder" required /></label>
        <label for="facebook"><span data-i18n="register.facebookLabel">Facebook</span><input id="facebook" type="text" placeholder="Facebook" data-i18n-placeholder="register.facebookPlaceholder" required /></label>
        <label for="tiktok"><span data-i18n="register.tiktokLabel">TikTok</span><input id="tiktok" type="text" placeholder="TikTok" data-i18n-placeholder="register.tiktokPlaceholder" required /></label>
        <label for="youtube"><span data-i18n="register.youtubeLabel">YouTube</span><input id="youtube" type="text" placeholder="YouTube" data-i18n-placeholder="register.youtubePlaceholder" required /></label>

        <label for="address"><span data-i18n="register.addressLabel">ที่อยู่</span><textarea id="address" placeholder="ที่อยู่" data-i18n-placeholder="register.addressPlaceholder" required></textarea></label>

        <label for="bank_name"><span data-i18n="register.bankNameLabel">ธนาคาร</span><input id="bank_name" type="text" placeholder="ชื่อธนาคาร" data-i18n-placeholder="register.bankNamePlaceholder" required /></label>
        <label for="bank_account"><span data-i18n="register.bankAccountLabel">เลขที่บัญชี</span><input id="bank_account" type="text" placeholder="เลขที่บัญชี" data-i18n-placeholder="register.bankAccountPlaceholder" required /></label>

        <label for="team_manager"><span data-i18n="register.teamManagerLabel">แม่ทีม</span><input id="team_manager" type="text" placeholder="Team Leader" data-i18n-placeholder="register.teamManagerPlaceholder" required /></label>
        <label for="am"><span data-i18n="register.amLabel">AM</span><input id="am" type="text" placeholder="AM (ถ้ามี)" data-i18n-placeholder="register.amPlaceholder" /></label>

        <button type="submit" data-i18n="register.submit" aria-label="ส่งใบสมัครตัวแทน" data-i18n-aria-label="register.submitLabel">สมัครตัวแทน</button>

      </form>

      <a href="agent-login.html" class="register-link" data-i18n="register.loginLink">เข้าสู่ระบบ</a>

    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/register.js"></script>
  <script src="js/logout.js"></script>

</body>
</html>
