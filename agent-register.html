<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครตัวแทน | SSBMS</title>

  <link rel="stylesheet" href="css/agent-login.css" />
</head>

<body>

  <main class="login-page">
    <section class="login-card">

      <h1>สมัครตัวแทน</h1>
      <p>กรอกข้อมูลให้ครบเพื่อสมัครเป็นตัวแทน</p>

      <!-- ✅ FORM -->
      <form class="login-form" onsubmit="submitRegister(event)">

        <input id="first_name" type="text" placeholder="ชื่อ" required />
        <input id="last_name" type="text" placeholder="นามสกุล" required />

        <input id="phone" type="text" placeholder="เบอร์โทรศัพท์" required />
        <input id="email" type="email" placeholder="อีเมล" required />
        <input id="password" type="password" placeholder="รหัสผ่าน" required />

        <input id="line" type="text" placeholder="LINE" required />
        <input id="facebook" type="text" placeholder="Facebook" required />
        <input id="tiktok" type="text" placeholder="TikTok" required />
        <input id="youtube" type="text" placeholder="YouTube" required />

        <textarea id="address" placeholder="ที่อยู่" required></textarea>

        <input id="bank_name" type="text" placeholder="ชื่อธนาคาร" required />
        <input id="bank_account" type="text" placeholder="เลขบัญชี" required />

        <input id="team_manager" type="text" placeholder="Team Manager" required />
        <input id="am" type="text" placeholder="AM (ถ้ามี)" />

        <button type="submit">สมัครตัวแทน</button>

      </form>

    </section>
  </main>

  <!-- ✅ JS -->
  <script src="js/register.js"></script>
  <script src="js/logout.js"></script>

</body>
</html>
