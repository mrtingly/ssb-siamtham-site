<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การอบรมตัวแทน | SSBMS</title>
  <style>
    :root{--blue:#1769d2;--blue2:#0d4fa8;--soft:#eef6ff;--ink:#102033;--muted:#64748b;--line:#dbe7f4;--ok:#16834f;--shadow:0 16px 40px rgba(35,82,130,.12)}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#f8fbff,#edf6ff);color:var(--ink)}button{font:inherit}.shell{max-width:1180px;margin:auto;padding:18px 14px 46px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#2f8cff,#0d57b8);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:1.25rem}.brand p{margin:2px 0 0;color:var(--muted);font-size:.88rem}.logout{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--blue2)}
    .layout{display:grid;grid-template-columns:320px 1fr;gap:20px}.side,.main{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.side{padding:20px;align-self:start;position:sticky;top:14px}.main{padding:24px}.eyebrow{display:inline-flex;background:var(--soft);color:var(--blue2);border-radius:999px;padding:7px 11px;font-size:.8rem;font-weight:800}.side h2{margin:14px 0 8px}.muted{color:var(--muted);line-height:1.65}.progress-wrap{margin:18px 0}.progress-label{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}.bar{height:12px;background:#e8f0f8;border-radius:999px;overflow:hidden}.bar>div{height:100%;width:0;background:linear-gradient(90deg,#38a1ff,#1769d2);transition:.3s}.lesson-list{display:grid;gap:10px;margin-top:18px}.lesson-btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;cursor:pointer;display:flex;gap:10px}.lesson-btn.active{border-color:var(--blue);background:#f3f8ff}.lesson-btn.done{border-color:#bfe4d0;background:#f2fbf6}.lesson-btn.locked{opacity:.55;cursor:not-allowed}.num{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--blue2);flex:0 0 auto}.lesson-btn.done .num{background:#dff5e9;color:var(--ok)}.lesson-btn strong{display:block}.lesson-btn span span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
    .hero{padding:22px;border-radius:20px;background:linear-gradient(135deg,#0d4fa8,#2f8cff);color:#fff;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:1.7rem}.hero p{margin:0;opacity:.9;line-height:1.7}.content-card{border:1px solid var(--line);border-radius:20px;padding:20px;background:#fff}.content-card ul{line-height:1.8}.video-box{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(135deg,#dcecff,#f7fbff);display:grid;place-items:center;color:var(--blue2);font-weight:900;border:1px dashed #9ec8f3;margin:16px 0}.lesson-actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.45;cursor:not-allowed}.message{display:none;margin-bottom:14px;padding:12px 14px;border-radius:13px;font-weight:700}.message.show{display:block}.message.ok{background:#edf9f3;color:#12623c;border:1px solid #bfe9d3}.message.err{background:#fff0f0;color:#8c1e1e;border:1px solid #ffd0d0}.exam-box{display:none;margin-top:20px;padding:18px;border-radius:18px;background:#edf9f3;border:1px solid #bfe9d3}.exam-box.show{display:block}.loading{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}}@media(max-width:600px){.lesson-actions{display:grid}.btn{width:100%}.shell{padding:12px 9px 32px}.side,.main{padding:16px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand"><div class="logo">SSB</div><div><h1>การอบรมตัวแทน SSB</h1><p>บริษัท สยามทำ จำกัด</p></div></div>
      <button class="logout" id="logoutBtn">ออกจากระบบ</button>
    </header>
    <div id="message" class="message"></div>
    <main class="layout">
      <aside class="side">
        <span class="eyebrow">หลักสูตรรับรองตัวแทน</span>
        <h2 id="agentName">ตัวแทน SSB</h2>
        <p class="muted">เรียนตามลำดับให้ครบทุกบท ระบบจะเปิดข้อสอบโดยอัตโนมัติ</p>
        <div class="progress-wrap"><div class="progress-label"><span>ความคืบหน้า</span><span id="progressText">0%</span></div><div class="bar"><div id="progressBar"></div></div></div>
        <div class="lesson-list" id="lessonList"></div>
      </aside>
      <section class="main">
        <div id="loadingBox" class="loading">กำลังโหลดความคืบหน้าจากระบบ...</div>
        <div id="courseBox" hidden>
          <div class="hero"><h2 id="lessonTitle"></h2><p id="lessonSubtitle"></p></div>
          <article class="content-card"><div id="lessonContent"></div><div class="lesson-actions"><button class="btn" id="prevBtn">ย้อนกลับ</button><button class="btn primary" id="completeBtn">เรียนจบบทนี้</button><button class="btn" id="nextBtn">บทถัดไป</button></div></article>
          <div class="exam-box" id="examBox"><h3>อบรมครบแล้ว</h3><p>ระบบได้ปลดล็อกข้อสอบรับรองตัวแทนให้คุณแล้ว</p><button class="btn primary" id="goExamBtn">เข้าสู่การสอบ</button></div>
        </div>
      </section>
    </main>
  </div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyKhWE-_SuKreCPyD4tsNmqNMQz2hZ8hQtrckk92mh8rszh1jaNEeuuFBGsPOLKfAziNg/exec";
const SESSION_KEYS=["ssb_agent_session","ssb_agent_session_v1"];
const lessons=[
{title:"บทที่ 1 แนะนำบริษัทและระบบ SSB",subtitle:"ทำความเข้าใจภาพรวมบริษัท ผลิตภัณฑ์ และบทบาทตัวแทน",html:"<h3>วัตถุประสงค์</h3><ul><li>รู้จักบริษัท สยามทำ จำกัด</li><li>เข้าใจภาพรวม SSB และ SSBMS</li><li>เข้าใจหน้าที่ของตัวแทน</li></ul><div class='video-box'>พื้นที่วิดีโออบรมบทที่ 1</div>"},
{title:"บทที่ 2 ความรู้เกี่ยวกับผลิตภัณฑ์",subtitle:"เรียนรู้องค์ประกอบ ประโยชน์ และการอธิบายผลิตภัณฑ์",html:"<h3>หัวข้อสำคัญ</h3><ul><li>องค์ประกอบของระบบ SSB</li><li>ประโยชน์ต่อผู้ใช้งาน</li><li>ข้อควรระวังในการให้ข้อมูลลูกค้า</li></ul><div class='video-box'>พื้นที่วิดีโออบรมบทที่ 2</div>"},
{title:"บทที่ 3 ขั้นตอนการขายและบริการลูกค้า",subtitle:"กระบวนการนำเสนอ รับคำสั่งซื้อ และติดตามลูกค้า",html:"<h3>ขั้นตอนมาตรฐาน</h3><ul><li>รับฟังความต้องการลูกค้า</li><li>นำเสนอข้อมูลตามความจริง</li><li>อธิบายราคาและเงื่อนไขชัดเจน</li><li>บริการหลังการขาย</li></ul><div class='video-box'>พื้นที่วิดีโออบรมบทที่ 3</div>"},
{title:"บทที่ 4 จรรยาบรรณและข้อกำหนด",subtitle:"ยึดหลักสุจริต ไม่กล่าวอ้างเกินจริง และรักษาข้อมูลลูกค้า",html:"<h3>จรรยาบรรณ</h3><ul><li>ไม่ให้ข้อมูลเท็จหรือเกินจริง</li><li>ไม่เปิดเผยข้อมูลลูกค้า</li><li>ไม่เรียกเก็บเงินนอกเหนือจากบริษัทกำหนด</li><li>ปฏิบัติตามกฎหมาย</li></ul><div class='video-box'>พื้นที่วิดีโออบรมบทที่ 4</div>"},
{title:"บทที่ 5 ค่าตอบแทน ทีมงาน และ Dashboard",subtitle:"เรียนรู้ระบบรายได้ การถอนเงิน และการทำงานกับทีม",html:"<h3>ระบบตัวแทน</h3><ul><li>รหัสตัวแทนและลิงก์แนะนำ</li><li>ยอดขาย รายได้ โบนัส และภาษี</li><li>การถอนเงินและประวัติรายการ</li><li>ระบบแม่ทีมและลูกทีม</li></ul><div class='video-box'>พื้นที่วิดีโออบรมบทที่ 5</div>"}
];
let current=0;
let progress=0;
let completedCount=0;
let saving=false;

function readJson(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return null}}
function getSession(){for(const key of SESSION_KEYS){const value=readJson(key);if(value)return value}return null}
function getAgentId(){const session=getSession();return session&&(session.agent_id||session.applicationId)||localStorage.getItem("agent_id")||localStorage.getItem("ssb_current_agent_v1")||localStorage.getItem("ssb_agent_id")||""}
function show(type,text){const box=document.getElementById("message");box.className="message show "+type;box.textContent=text}
function jsonp(url){return new Promise((resolve,reject)=>{const callback="training_cb_"+Date.now()+"_"+Math.floor(Math.random()*10000);const script=document.createElement("script");const clean=()=>{try{delete window[callback]}catch(e){window[callback]=undefined}if(script.parentNode)script.remove()};window[callback]=data=>{clean();resolve(data)};script.onerror=()=>{clean();reject(new Error("เชื่อมต่อระบบไม่ได้"))};script.src=url+"&callback="+encodeURIComponent(callback)+"&_="+Date.now();document.body.appendChild(script)})}
function routeStatus(status){const s=String(status||"").toUpperCase();if(s==="EXAM")location.replace("agent-exam.html");else if(s==="WAIT_APPROVAL"||s==="PENDING")location.replace("agent-waiting.html");else if(s==="APPROVED")location.replace("agent-dashboard.html");else if(s==="REJECTED"||s==="SUSPENDED")location.replace("agent-login.html")}
function calculateCompletedCount(value){return Math.max(0,Math.min(lessons.length,Math.floor(Number(value||0)/20)))}
function render(){
  document.getElementById("lessonTitle").textContent=lessons[current].title;
  document.getElementById("lessonSubtitle").textContent=lessons[current].subtitle;
  document.getElementById("lessonContent").innerHTML=lessons[current].html;
  const isDone=current<completedCount;
  const isCurrent=current===completedCount&&completedCount<lessons.length;
  document.getElementById("prevBtn").disabled=current===0;
  document.getElementById("nextBtn").disabled=current>=Math.min(completedCount,lessons.length-1);
  document.getElementById("completeBtn").disabled=saving||isDone||!isCurrent||progress>=100;
  document.getElementById("completeBtn").textContent=isDone?"เรียนจบแล้ว":saving?"กำลังบันทึก...":"เรียนจบบทนี้";
  renderList();
  renderProgress();
}
function renderList(){
  document.getElementById("lessonList").innerHTML=lessons.map((lesson,index)=>{
    const done=index<completedCount;
    const unlocked=index<=completedCount;
    return `<button class="lesson-btn ${index===current?'active':''} ${done?'done':''} ${!unlocked?'locked':''}" data-i="${index}" ${!unlocked?'disabled':''}><span class="num">${done?'✓':index+1}</span><span><strong>${lesson.title}</strong><span>${done?'เรียนจบแล้ว':unlocked?'พร้อมเรียน':'ยังไม่ปลดล็อก'}</span></span></button>`;
  }).join("");
  document.querySelectorAll(".lesson-btn:not([disabled])").forEach(button=>button.onclick=()=>{current=Number(button.dataset.i);render()});
}
function renderProgress(){
  document.getElementById("progressText").textContent=progress+"%";
  document.getElementById("progressBar").style.width=progress+"%";
  document.getElementById("examBox").classList.toggle("show",progress>=100);
}
async function loadProgress(){
  const agentId=getAgentId();
  if(!agentId){show("err","ไม่พบข้อมูลผู้เข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่");setTimeout(()=>location.replace("agent-login.html"),1000);return}
  try{
    const result=await jsonp(API_URL+"?action=getAgentStatus&agent_id="+encodeURIComponent(agentId));
    if(!result||!result.ok)throw new Error((result&&result.message)||"โหลดข้อมูลไม่สำเร็จ");
    routeStatus(result.status);
    progress=Math.max(0,Math.min(100,Number(result.training_progress||0)));
    completedCount=calculateCompletedCount(progress);
    current=Math.min(completedCount,lessons.length-1);
    document.getElementById("loadingBox").hidden=true;
    document.getElementById("courseBox").hidden=false;
    render();
  }catch(error){show("err",error.message||"เชื่อมต่อระบบไม่ได้")}
}
async function completeCurrentLesson(){
  if(saving||current!==completedCount||progress>=100)return;
  const agentId=getAgentId();
  const nextProgress=Math.min(100,(completedCount+1)*20);
  saving=true;render();
  try{
    const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"updateTrainingProgress",agent_id:agentId,progress:nextProgress})});
    const result=await response.json();
    if(!result.ok)throw new Error(result.message||"บันทึกไม่สำเร็จ");
    progress=Number(result.training_progress||nextProgress);
    completedCount=calculateCompletedCount(progress);
    show("ok",progress>=100?"อบรมครบแล้ว สามารถเข้าสู่การสอบได้":"บันทึกความคืบหน้าแล้ว");
    if(progress<100)current=Math.min(completedCount,lessons.length-1);
  }catch(error){show("err",error.message||"บันทึกไม่สำเร็จ")}
  finally{saving=false;render()}
}

document.getElementById("completeBtn").onclick=completeCurrentLesson;
document.getElementById("prevBtn").onclick=()=>{if(current>0){current--;render()}};
document.getElementById("nextBtn").onclick=()=>{if(current<Math.min(completedCount,lessons.length-1)){current++;render()}};
document.getElementById("goExamBtn").onclick=()=>location.href="agent-exam.html";
document.getElementById("logoutBtn").onclick=()=>{["agent_id","agent_name","agent_role","agent_status","ssb_agent_id","ssb_current_agent_v1",...SESSION_KEYS].forEach(key=>localStorage.removeItem(key));location.href="agent-login.html"};
const session=getSession();if(session&&session.name)document.getElementById("agentName").textContent=session.name;
loadProgress();
</script>
</body>
</html>
