<!DOCTYPE html>
<!-- SBOS V3-5 marker: Home content CMS. -->
<html lang="th">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>SBOS CMS Home</title><link rel="icon" href="images/logo.png" /><link rel="stylesheet" href="css/sbos-typography.css" /><link rel="stylesheet" href="css/sbos-cms.css" /></head>
<body data-cms-page="content" data-cms-type="PAGE_SECTION">
  <div class="cms-shell"><aside class="cms-side"><div class="cms-brand"><img src="images/logo.png" alt="Siamtham" /><div><strong>SBOS CMS</strong><span>V3-5 Home</span></div></div><nav class="cms-menu" aria-label="CMS navigation"><a href="admin-cms.html">Dashboard</a><a class="active" href="admin-cms-home.html">Home</a><a href="admin-cms-products.html">Products</a><a href="admin-cms-promotions.html">Promotions</a><a href="admin-cms-settings.html">Settings</a></nav></aside><main class="cms-main"><header class="cms-top"><div><h1>Home Content</h1><p>Manage home page sections, CTA, and announcements.</p></div><button id="refreshButton" class="cms-btn" type="button">Refresh</button></header><section class="cms-content">
    <form id="cmsContentForm" class="cms-form"><input type="hidden" name="content_type" value="PAGE_SECTION" /><label>Key<input name="content_key" required /></label><label>Slug<input name="slug" value="home" /></label><label>Locale<select name="locale"><option value="th">th</option><option value="en">en</option></select></label><label>Placement<input name="placement" value="home" /></label><label class="wide">Title<input name="title" required /></label><label class="wide">Subtitle<input name="subtitle" /></label><label class="wide">Summary<textarea name="summary"></textarea></label><label class="wide">Body<textarea name="body"></textarea></label><label>CTA Label<input name="cta_label" /></label><label>CTA URL<input name="cta_url" /></label><label>Order<input name="display_order" type="number" value="10" /></label><label>Audience<input name="audience" value="PUBLIC" /></label><button class="cms-btn" type="submit">Save Draft</button></form>
    <section class="cms-panel"><h3>Home Sections</h3><div class="cms-table-wrap"><table class="cms-table"><thead><tr><th>ID</th><th>Type</th><th>Title</th><th>Slug</th><th>Status</th><th>Actions</th></tr></thead><tbody id="contentRows"></tbody></table></div></section>
  </section></main></div><div id="cmsToast" class="cms-toast" role="status" aria-live="polite"></div><script src="js/admin-guard.js"></script><script src="js/sbos-api-config.js"></script><script src="js/sbos-cms-admin.js"></script></body></html>
