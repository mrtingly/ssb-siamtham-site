<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSB - ดูภาพ Safety Book</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background:#f8fafc; }
    .card { background:#fff; border-radius:20px; border:1px solid #e2e8f0; box-shadow:0 10px 30px rgba(15,23,42,.06); }
    .btn { border-radius:14px; padding:.9rem 1rem; font-weight:700; }
  </style>
</head>
<body>
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
      <h1 class="text-2xl font-bold text-slate-900">Preview Safety Book</h1>
      <p class="text-sm text-slate-500">Step 2 — ต้องดูภาพให้ครบ 8 ภาพก่อน</p>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div id="statusBox" class="hidden mb-6"></div>

    <div class="grid xl:grid-cols-3 gap-8">
      <div class="xl:col-span-2 card p-6">
        <div class="flex items-center justify-between mb-5">
          <div>
            <h2 id="slideTitle" class="text-2xl font-bold text-slate-900"></h2>
            <p id="slideDesc" class="text-slate-500 mt-1"></p>
          </div>
          <div class="text-sm text-slate-500">
            ดูแล้ว <span id="seenCount" class="font-bold text-slate-900">0</span> / 8
          </div>
        </div>

        <div class="rounded-2xl overflow-hidden border border-slate-200 bg-slate-100">
          <img id="slideImage" class="w-full h-[260px] sm:h-[420px] object-cover" alt="Preview" />
        </div>

        <div class="grid grid-cols-2 gap-4 mt-6">
          <button id="btnPrev" class="btn border border-slate-300 bg-white text-slate-700">← ภาพก่อนหน้า</button>
          <button id="btnNext" class="btn bg-blue-600 text-white">ภาพถัดไป →</button>
        </div>
      </div>

      <aside class="card p-6 h-fit">
        <h3 class="text-xl font-bold text-slate-900 mb-4">รายการที่เลือก</h3>
        <div id="summaryBox" class="space-y-2 text-sm text-slate-600 mb-6"></div>

        <div class="rounded-2xl bg-blue-50 border border-blue-100 p-4 text-sm text-blue-700">
          คุณต้องเปิดดูภาพให้ครบทั้งภายนอกและภายใน ก่อนระบบจะอนุญาตให้ไปเลือกโทรศัพท์
        </div>

        <button id="btnToDevice" class="btn w-full mt-6 bg-slate-300 text-slate-600 cursor-not-allowed" disabled>
          ไปเลือกโทรศัพท์
        </button>
      </aside>
    </div>
  </main>

<script type="module" src="./js/book_preview.js"></script>
</body>
</html>
