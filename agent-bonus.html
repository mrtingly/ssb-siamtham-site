    <div>
      <strong>SSBMS</strong>
      <span>Agent System</span>
    </div>
  </div>

  <nav class="side-menu">
    <a href="agent-dashboard.html">Dashboard</a>
    <a href="book.html">สั่งสินค้า</a>
    <a href="agent-leads.html">ลูกค้า</a>

  </div>

</header>

<section class="bonus-summary">
  <div class="bonus-card">
    <span>โบนัสรวมทั้งหมด</span>

    <table>
      <thead>
        <tr>
          <th>รหัสโบนัส</th>

      </thead>

      <tbody id="bonusTable">
        <tr><td colspan="6">กำลังโหลด...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script src="js/agent-api.js"></script>

<script>
const agentId = localStorage.getItem("agent_id");

if(!agentId){
  location.href = "agent-login.html";
}else{
  loadBonusPage(agentId);
}
</script>

  <script src="js/sbos-api-config.js"></script><script src="js/logout.js"></script>
