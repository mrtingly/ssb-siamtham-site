<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สอบรับรองตัวแทน | SSBMS</title>
  <style>
    :root{--blue:#1769d2;--blue2:#0d4fa8;--soft:#eef6ff;--ink:#102033;--muted:#64748b;--line:#dbe7f4;--ok:#16834f;--bad:#b42318;--shadow:0 16px 40px rgba(35,82,130,.12)}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#f8fbff,#edf6ff);color:var(--ink)}button{font:inherit}.shell{max-width:980px;margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#2f8cff,#0d57b8);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{margin:0;font-size:1.2rem}.brand p{margin:2px 0 0;color:var(--muted);font-size:.86rem}.logout{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--blue2)}
    .hero,.exam-card,.result-card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:22px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.eyebrow{display:inline-flex;background:var(--soft);color:var(--blue2);border-radius:999px;padding:7px 11px;font-size:.8rem;font-weight:800}.hero h2{margin:12px 0 7px;font-size:1.75rem}.hero p{margin:0;color:var(--muted);line-height:1.7}.timer{min-width:130px;text-align:center;padding:14px;border-radius:18px;background:#102f58;color:#fff}.timer strong{display:block;font-size:1.8rem}.timer.danger{background:#9d231c}
    .exam-card{padding:22px}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted);font-weight:700}.progress{height:10px;background:#e8f0f8;border-radius:999px;overflow:hidden;margin-bottom:22px}.progress div{height:100%;width:0;background:linear-gradient(90deg,#38a1ff,#1769d2)}.question{display:none}.question.active{display:block}.question h3{font-size:1.2rem;line-height:1.65;margin:0 0 18px}.choices{display:grid;gap:12px}.choice{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:#fff}.choice.selected{border-color:var(--blue);background:#eef6ff}.choice input{margin-top:4px}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.success{background:var(--ok);color:#fff;border-color:var(--ok)}.btn:disabled{opacity:.45}.message{display:none;margin-bottom:14px;padding:12px 14px;border-radius:13px;font-weight:700}.message.show{display:block}.message.err{background:#fff0f0;color:#8c1e1e;border:1px solid #ffd0d0}.message.ok{background:#edf9f3;color:#12623c;border:1px solid #bfe9d3}.result-card{display:none;text-align:center;padding:34px 22px}.result-card.show{display:block}.score{font-size:3rem;font-weight:900;color:var(--blue2)}
    @media(max-width:650px){.hero{grid-template-columns:1fr}.timer{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .submit{grid-column:1/-1}.btn{width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand"><div class="logo">SSB</div><div><h1>ข้อสอบรับรองตัวแทน SSB</h1><p>บริษัท สยามทำ จำกัด</p></div></div><button class="logout" id="logoutBtn">ออกจากระบบ</button></header>
  <div id="message" class="message"></div>
  <section class="hero"><div><span class="eyebrow">การสอบรับรอง</span><h2>ทำคะแนนให้ได้อย่างน้อย 80%</h2><p>ข้อสอบมี 10 ข้อ ข้อละ 10 คะแนน กรุณาตอบให้ครบก่อนส่งข้อสอบ</p></div><div class="timer" id="timerBox"><small>เวลาคงเหลือ</small><strong id="timerText">20:00</strong></div></section>
  <main class="exam-card" id="examCard"><div class="meta"><span id="questionNumber">ข้อ 1 จาก 10</span><span id="answeredCount">ตอบแล้ว 0 ข้อ</span></div><div class="progress"><div id="progressBar"></div></div><form id="examForm"></form><div class="actions"><button class="btn" id="prevBtn" type="button">ย้อนกลับ</button><button class="btn primary" id="nextBtn" type="button">ข้อถัดไป</button><button class="btn success submit" id="submitBtn" type="button">ส่งข้อสอบ</button></div></main>
  <section class="result-card" id="resultCard"><div class="score" id="scoreText">0%</div><h2 id="resultTitle"></h2><p id="resultMessage"></p><button class="btn primary" id="resultButton"></button></section>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyKhWE-_SuKreCPyD4tsNmqNMQz2hZ8hQtrckk92mh8rszh1jaNEeuuFBGsPOLKfAziNg/exec";
const SESSION_KEYS=["ssb_agent_session","ssb_agent_session_v1"];
const TIME_LIMIT=20*60;
const QUESTIONS=[
{q:"หน้าที่สำคัญของตัวแทน SSB คือข้อใด",c:["ให้ข้อมูลตามความจริงและดูแลลูกค้า","กล่าวอ้างว่าสินค้าป้องกันภัยได้ทุกชนิด","กำหนดราคาเองโดยไม่แจ้งบริษัท","ขอรหัสธนาคารของลูกค้า"],a:0},
{q:"เมื่ออธิบายผลิตภัณฑ์แก่ลูกค้า ตัวแทนควรปฏิบัติอย่างไร",c:["ใช้ข้อมูลที่บริษัทรับรองและไม่กล่าวอ้างเกินจริง","รับประกันว่าไม่มีความเสี่ยงทุกกรณี","ปิดบังเงื่อนไขสำคัญ","เพิ่มค่าบริการตามใจ"],a:0},
{q:"ข้อมูลส่วนบุคคลของลูกค้าควรได้รับการจัดการแบบใด",c:["เก็บรักษาอย่างเหมาะสมและใช้ตามวัตถุประสงค์","ส่งให้ลูกทีมทุกคน","เผยแพร่ในกลุ่มสาธารณะ","นำไปใช้โดยไม่แจ้ง"],a:0},
{q:"หากลูกค้ายังไม่เข้าใจสินค้า ตัวแทนควรทำอย่างไร",c:["อธิบายเพิ่มเติมอย่างชัดเจนและให้เวลาตัดสินใจ","เร่งให้ชำระเงินทันที","ข้ามข้อมูลที่ซับซ้อน","รับปากแทนบริษัททุกเรื่อง"],a:0},
{q:"ขั้นตอนการขายที่เหมาะสมเริ่มจากอะไร",c:["รับฟังปัญหาและความต้องการของลูกค้า","ส่งเลขบัญชีทันที","ขอเอกสารส่วนตัวทั้งหมด","เสนอสินค้าราคาแพงที่สุดก่อน"],a:0},
{q:"ข้อใดเป็นจรรยาบรรณของตัวแทน",c:["ไม่เรียกเก็บเงินนอกเหนือจากที่บริษัทกำหนด","แก้ไขราคาบริษัทเอง","ใช้ข้อมูลลูกค้าเพื่อประโยชน์ส่วนตัว","สร้างคำโฆษณาเกินจริง"],a:0},
{q:"หากไม่แน่ใจคำตอบเกี่ยวกับสินค้า ควรทำอย่างไร",c:["ตรวจสอบกับบริษัทหรือผู้รับผิดชอบก่อนตอบ","คาดเดาคำตอบให้ลูกค้า","นำข้อมูลที่ไม่ทราบแหล่งมาใช้","หลีกเลี่ยงลูกค้า"],a:0},
{q:"ระบบ Dashboard ตัวแทนมีไว้เพื่ออะไร",c:["ติดตามข้อมูลตัวแทน ยอดขาย รายได้ และรายการที่เกี่ยวข้อง","เก็บรหัสผ่านธนาคารลูกค้า","แก้ไขข้อมูลบริษัท","อนุมัติตนเองเป็นแอดมิน"],a:0},
{q:"ตัวแทนจะได้รับสิทธิ์ Dashboard เต็มรูปแบบเมื่อใด",c:["สอบผ่านและได้รับการอนุมัติจากแอดมิน","ทันทีที่เปิดหน้าเว็บ","เมื่อกรอกชื่ออย่างเดียว","ก่อนเข้าอบรม"],a:0},
{q:"หลังสอบผ่าน ระบบควรเปลี่ยนไปสู่ขั้นตอนใด",c:["รอแอดมินตรวจสอบและอนุมัติ","รับเงินทันที","เป็นผู้จัดการทีมอัตโนมัติ","ลบข้อมูลการอบรม"],a:0}
];
let current=0,remaining=TIME_LIMIT,timerId=null,submitted=false;const answers=new Array(QUESTIONS.length).fill(null);
function readJson(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return null}}
function getSession(){for(const key of SESSION_KEYS){const value=readJson(key);if(value)return value}return null}
function getAgentId(){const s=getSession();return s&&(s.agent_id||s.applicationId)||localStorage.getItem("agent_id")||localStorage.getItem("ssb_current_agent_v1")||localStorage.getItem("ssb_agent_id")||""}
function show(type,text){const box=document.getElementById("message");box.className="message show "+type;box.textContent=text}
function renderQuestions(){document.getElementById("examForm").innerHTML=QUESTIONS.map((item,i)=>`<section class="question ${i===0?'active':''}" data-q="${i}"><h3>${i+1}. ${item.q}</h3><div class="choices">${item.c.map((choice,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"><span>${choice}</span></label>`).join('')}</div></section>`).join('');document.querySelectorAll('input[type=radio]').forEach(input=>input.onchange=e=>{const qi=Number(e.target.name.slice(1));answers[qi]=Number(e.target.value);document.querySelectorAll(`[name=q${qi}]`).forEach(r=>r.closest('.choice').classList.toggle('selected',r.checked));updateMeta()})}
function showQuestion(){document.querySelectorAll('.question').forEach((q,i)=>q.classList.toggle('active',i===current));document.getElementById('questionNumber').textContent=`ข้อ ${current+1} จาก ${QUESTIONS.length}`;document.getElementById('progressBar').style.width=((current+1)/QUESTIONS.length*100)+'%';document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===QUESTIONS.length-1;document.getElementById('nextBtn').textContent=current===QUESTIONS.length-1?'ข้อสุดท้าย':'ข้อถัดไป'}
function updateMeta(){document.getElementById('answeredCount').textContent=`ตอบแล้ว ${answers.filter(v=>v!==null).length} ข้อ`}
function startTimer(){timerId=setInterval(()=>{remaining--;const m=String(Math.floor(remaining/60)).padStart(2,'0');const s=String(remaining%60).padStart(2,'0');document.getElementById('timerText').textContent=`${m}:${s}`;if(remaining<=300)document.getElementById('timerBox').classList.add('danger');if(remaining<=0){clearInterval(timerId);submitExam(true)}},1000)}
async function submitExam(auto=false){if(submitted)return;if(!auto&&answers.some(v=>v===null)){show('err','กรุณาตอบคำถามให้ครบทุกข้อก่อนส่งข้อสอบ');return}submitted=true;clearInterval(timerId);const correct=answers.reduce((t,v,i)=>t+(v===QUESTIONS[i].a?1:0),0);const score=correct*10;const agentId=getAgentId();if(!agentId){show('err','ไม่พบข้อมูลผู้เข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่');submitted=false;return}try{const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submitExam',agent_id:agentId,score})});const result=await res.json();if(!result.ok)throw new Error(result.message||'ส่งคะแนนไม่สำเร็จ');document.getElementById('examCard').style.display='none';document.getElementById('resultCard').classList.add('show');document.getElementById('scoreText').textContent=score+'%';document.getElementById('resultTitle').textContent=result.passed?'สอบผ่าน':'ยังไม่ผ่าน';document.getElementById('resultMessage').textContent=result.message;const btn=document.getElementById('resultButton');btn.textContent=result.passed?'ไปหน้ารออนุมัติ':'กลับไปทบทวนบทเรียน';btn.onclick=()=>location.href=result.passed?'agent-waiting.html':'agent-learning.html'}catch(e){show('err',e.message);submitted=false}}
document.getElementById('prevBtn').onclick=()=>{if(current>0){current--;showQuestion()}};document.getElementById('nextBtn').onclick=()=>{if(current<QUESTIONS.length-1){current++;showQuestion()}};document.getElementById('submitBtn').onclick=()=>submitExam(false);document.getElementById('logoutBtn').onclick=()=>{SESSION_KEYS.forEach(k=>localStorage.removeItem(k));localStorage.removeItem('agent_id');location.href='agent-login.html'};
renderQuestions();showQuestion();updateMeta();startTimer();if(!getAgentId())show('err','ไม่พบข้อมูลผู้เข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่');
</script>
</body>
</html>
