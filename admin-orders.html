<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Center | SSBMS Admin</title>
<link rel="icon" href="images/logo.png"><link rel="stylesheet" href="css/sbos-core.css">
<style>
body{background:#f5f7fa}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:22px 16px;background:#071a2f;color:#fff}.side .logo{display:flex;gap:11px;align-items:center;padding:0 7px 24px}.side img{width:42px}.side small{display:block;color:#9fb1c6}.menu{display:grid;gap:5px}.menu a{padding:12px 13px;border-radius:13px;color:#c7d2df;font-size:.78rem;font-weight:700}.menu a.active,.menu a:hover{background:rgba(255,255,255,.1);color:#fff}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.content{padding:26px;max-width:1600px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:25px;border-radius:24px;background:linear-gradient(135deg,#05284d,#0b72ce);color:#fff}.hero h1{margin:0;font-size:clamp(2rem,4.5vw,3.8rem);letter-spacing:-.05em}.hero p{margin:10px 0 0;color:#dbeafe}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{padding:17px;background:#fff;border:1px solid #e5e7eb;border-radius:18px}.stat small{color:#6b7280}.stat strong{display:block;margin-top:7px;font-size:1.65rem}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden}.toolbar{padding:15px;border-bottom:1px solid #edf0f3;display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{height:42px;border:1px solid #d8dde5;border-radius:12px;padding:0 11px}.orders{display:grid}.order{display:grid;grid-template-columns:1fr 1.1fr 1.25fr .8fr .9fr 1fr;gap:12px;align-items:center;padding:16px;border-bottom:1px solid #edf0f3;font-size:.75rem}.order:last-child{border:0}.order b{display:block}.order small{color:#6b7280}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:.64rem;font-weight:800}.waiting_payment{background:#fff5e6;color:#955b00}.approved{background:#eaf3ff;color:#075aab}.installing{background:#eef7ff;color:#0066cc}.shipping{background:#f2edff;color:#6941c6}.completed{background:#eaf8f1;color:#147a46}.cancelled{background:#fff0ef;color:#b42318}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:999px;padding:8px 10px;font-size:.65rem;font-weight:800}.primary{background:#0672ce;color:#fff}.secondary{background:#eef2f6;color:#334155}.danger{background:#fff0ef;color:#b42318}.empty{padding:50px;text-align:center;color:#6b7280}@media(max-width:1100px){.shell{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:repeat(2,1fr)}.order{grid-template-columns:1fr 1fr}}@media(max-width:620px){.content{padding:12px}.stats{grid-template-columns:1fr}.order{grid-template-columns:1fr}.toolbar input,.toolbar select{width:100%}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="logo"><img src="images/logo.png" alt="SSBMS"><div><b>SSBMS Admin ERP</b><small>บริษัท สยามทำ จำกัด</small></div></div><nav class="menu"><a href="admin-dashboard.html">ภาพรวม</a><a href="admin-quotations.html">ใบเสนอราคา</a><a class="active" href="admin-orders.html">คำสั่งซื้อ</a><a href="admin-installation.html">งานติดตั้ง</a><a href="admin-agent.html">ตัวแทน</a><a href="admin-bonus.html">คอมมิชชัน</a></nav></aside><main class="main"><header class="top"><div><b>Order Center</b><small style="display:block;color:#6b7280">สำนักงานใหญ่</small></div><a href="admin-dashboard.html">กลับภาพรวม</a></header><div class="content"><section class="hero"><div><h1>บริหารคำสั่งซื้อ</h1><p>ตรวจชำระเงิน อนุมัติเริ่มงานติดตั้ง จัดส่ง และปิดงานจากศูนย์กลางเดียว</p></div></section><section class="stats"><div class="stat"><small>ทั้งหมด</small><strong id="all">0</strong></div><div class="stat"><small>รอชำระ</small><strong id="wait">0</strong></div><div class="stat"><small>กำลังติดตั้ง</small><strong id="install">0</strong></div><div class="stat"><small>กำลังจัดส่ง</small><strong id="ship">0</strong></div><div class="stat"><small>สำเร็จ</small><strong id="done">0</strong></div></section><section class="panel"><div class="toolbar"><input id="search" placeholder="ค้นหา Order, ลูกค้า, ตัวแทน, รุ่น"><select id="filter"><option value="all">ทุกสถานะ</option><option value="waiting_payment">รอชำระเงิน</option><option value="approved">อนุมัติแล้ว</option><option value="installing">กำลังติดตั้ง</option><option value="shipping">กำลังจัดส่ง</option><option value="completed">ส่งมอบแล้ว</option><option value="cancelled">ยกเลิก</option></select></div><div id="orders" class="orders"></div></section></div></main></div>
<script src="js/sbos-core.js"></script>
<script>
'use strict';const $=s=>document.querySelector(s);const money=v=>'฿'+Number(v||0).toLocaleString('th-TH');let orders=JSON.parse(localStorage.getItem('ssb_orders')||'[]');
function label(s){return({waiting_payment:'รอชำระเงิน',approved:'อนุมัติแล้ว',installing:'กำลังติดตั้ง',shipping:'กำลังจัดส่ง',completed:'ส่งมอบแล้ว',cancelled:'ยกเลิก'})[s]||s||'รอดำเนินการ'}
function save(){localStorage.setItem('ssb_orders',JSON.stringify(orders));render()}
function setStatus(id,status){const i=orders.findIndex(x=>x.orderId===id);if(i<0)return;orders[i].status=status;orders[i].updatedAt=new Date().toISOString();orders[i].history=orders[i].history||[];orders[i].history.push({status,at:orders[i].updatedAt,by:'admin'});if(status==='installing'){let jobs=JSON.parse(localStorage.getItem('ssb_install_jobs')||'[]');if(!jobs.some(j=>j.orderId===id)){jobs.unshift({installJobId:'IJ-'+Date.now(),orderId:id,customerName:orders[i].customerName||orders[i].customer?.name||'',model:orders[i].model||'',status:'queued',createdAt:new Date().toISOString()});localStorage.setItem('ssb_install_jobs',JSON.stringify(jobs))}}save()}
function render(){const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;const list=orders.filter(o=>(f==='all'||o.status===f)&&[o.orderId,o.quoteId,o.customerName,o.customer?.name,o.agentName,o.agentId,o.model].join(' ').toLowerCase().includes(q));$('#all').textContent=orders.length;$('#wait').textContent=orders.filter(o=>o.status==='waiting_payment').length;$('#install').textContent=orders.filter(o=>o.status==='installing').length;$('#ship').textContent=orders.filter(o=>o.status==='shipping').length;$('#done').textContent=orders.filter(o=>o.status==='completed').length;if(!list.length){$('#orders').innerHTML='<div class="empty">ยังไม่มีคำสั่งซื้อ</div>';return}$('#orders').innerHTML=list.slice().reverse().map(o=>`<div class="order"><div><b>${o.orderId||'-'}</b><small>${o.quoteId||'-'}</small></div><div><b>${o.customerName||o.customer?.name||'-'}</b><small>${o.customer?.phone||o.customerPhone||''}</small></div><div><b>${o.model||'-'} ${o.storage||''}</b><small>${o.color||''} · ${o.agentName||o.agentId||'ตัวแทน'}</small></div><div><b>${money(o.grandTotal)}</b><small>ยอดสุทธิ</small></div><div><span class="badge ${o.status||'waiting_payment'}">${label(o.status)}</span></div><div class="actions">${o.status==='waiting_payment'?`<button class="primary" onclick="setStatus('${o.orderId}','approved')">ยืนยันชำระ</button>`:''}${o.status==='approved'?`<button class="primary" onclick="setStatus('${o.orderId}','installing')">เริ่มติดตั้ง</button>`:''}${o.status==='installing'?`<button class="primary" onclick="setStatus('${o.orderId}','shipping')">พร้อมจัดส่ง</button>`:''}${o.status==='shipping'?`<button class="primary" onclick="setStatus('${o.orderId}','completed')">ส่งมอบแล้ว</button>`:''}${!['completed','cancelled'].includes(o.status)?`<button class="danger" onclick="setStatus('${o.orderId}','cancelled')">ยกเลิก</button>`:''}</div></div>`).join('')}
$('#search').oninput=render;$('#filter').onchange=render;render();
</script></body></html>
