<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Center | SSBMS Admin</title>
<link rel="icon" href="images/logo.png"><link rel="stylesheet" href="css/sbos-core.css">
<style>
body{background:#f5f7fa}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{padding:22px 16px;background:#071a2f;color:#fff}.side .logo{display:flex;gap:11px;align-items:center;padding:0 7px 24px}.side img{width:42px}.side small{display:block;color:#9fb1c6}.menu{display:grid;gap:5px}.menu a{padding:12px 13px;border-radius:13px;color:#c7d2df;font-size:.78rem;font-weight:700}.menu a.active,.menu a:hover{background:rgba(255,255,255,.1);color:#fff}.main{min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.content{padding:26px;max-width:1600px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:25px;border-radius:24px;background:linear-gradient(135deg,#05284d,#0b72ce);color:#fff}.hero h1{margin:0;font-size:clamp(2rem,4.5vw,3.8rem);letter-spacing:-.05em}.hero p{margin:10px 0 0;color:#dbeafe}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{padding:17px;background:#fff;border:1px solid #e5e7eb;border-radius:18px}.stat small{color:#6b7280}.stat strong{display:block;margin-top:7px;font-size:1.65rem}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:22px;overflow:hidden}.toolbar{padding:15px;border-bottom:1px solid #edf0f3;display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{height:42px;border:1px solid #d8dde5;border-radius:12px;padding:0 11px}.orders{display:grid}.order{display:grid;grid-template-columns:1fr 1.1fr 1.25fr .8fr .9fr 1fr;gap:12px;align-items:center;padding:16px;border-bottom:1px solid #edf0f3;font-size:.75rem}.order:last-child{border:0}.order b{display:block}.order small{color:#6b7280}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:.64rem;font-weight:800}.waiting_payment{background:#fff5e6;color:#955b00}.approved{background:#eaf3ff;color:#075aab}.installing{background:#eef7ff;color:#0066cc}.shipping{background:#f2edff;color:#6941c6}.completed{background:#eaf8f1;color:#147a46}.cancelled{background:#fff0ef;color:#b42318}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:0;border-radius:999px;padding:8px 10px;font-size:.65rem;font-weight:800}.primary{background:#0672ce;color:#fff}.danger{background:#fff0ef;color:#b42318}.empty{padding:50px;text-align:center;color:#6b7280}@media(max-width:1100px){.shell{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:repeat(2,1fr)}.order{grid-template-columns:1fr 1fr}}@media(max-width:620px){.content{padding:12px}.stats{grid-template-columns:1fr}.order{grid-template-columns:1fr}.toolbar input,.toolbar select{width:100%}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="logo"><img src="images/logo.png" alt="SSBMS"><div><b>SSBMS Admin ERP</b><small>บริษัท สยามทำ จำกัด</small></div></div><nav class="menu"><a href="admin-dashboard.html">ภาพรวม</a><a href="admin-quotations.html">ใบเสนอราคา</a><a class="active" href="admin-orders.html">คำสั่งซื้อ</a><a href="admin-installation.html">งานติดตั้ง</a><a href="admin-agent.html">ตัวแทน</a><a href="admin-bonus.html">คอมมิชชัน</a></nav></aside><main class="main"><header class="top"><div><b>Order Center</b><small style="display:block;color:#6b7280">สำนักงานใหญ่</small></div><a href="admin-dashboard.html">กลับภาพรวม</a></header><div class="content"><section class="hero"><div><h1>บริหารคำสั่งซื้อ</h1><p>ตรวจชำระเงิน อนุมัติเริ่มงานติดตั้ง จัดส่ง และปิดงานจากศูนย์กลางเดียว</p></div></section><section class="stats"><div class="stat"><small>ทั้งหมด</small><strong id="all">0</strong></div><div class="stat"><small>รอชำระ</small><strong id="wait">0</strong></div><div class="stat"><small>กำลังติดตั้ง</small><strong id="install">0</strong></div><div class="stat"><small>พร้อมติดตั้ง</small><strong id="ship">0</strong></div><div class="stat"><small>สำเร็จ</small><strong id="done">0</strong></div></section><section class="panel"><div class="toolbar"><input id="search" placeholder="ค้นหา Order, ลูกค้า, ตัวแทน, รุ่น"><select id="filter"><option value="all">ทุกสถานะ</option><option value="PAYMENT_PENDING">รอชำระเงิน</option><option value="PAYMENT_REVIEW">รอตรวจชำระ</option><option value="PAID">ชำระแล้ว</option><option value="PREPARING">กำลังเตรียมสินค้า</option><option value="READY_TO_INSTALL">พร้อมติดตั้ง</option><option value="INSTALLING">กำลังติดตั้ง</option><option value="COMPLETED">ส่งมอบแล้ว</option><option value="CANCELLED">ยกเลิก</option></select></div><div id="orders" class="orders"></div></section></div></main></div>
<script src="js/sbos-core.js"></script>
<script>
'use strict';const API_URL='https://script.google.com/macros/s/AKfycbyKhWE-_SuKreCPyD4tsNmqNMQz2hZ8hQtrckk92mh8rszh1jaNEeuuFBGsPOLKfAziNg/exec';const $=s=>document.querySelector(s);const money=v=>'฿'+Number(v||0).toLocaleString('th-TH');let orders=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalize(s){return String(s||'PAYMENT_PENDING').toUpperCase()}
function statusClass(s){return({PAYMENT_PENDING:'waiting_payment',PAYMENT_REVIEW:'waiting_payment',PAID:'approved',PREPARING:'approved',READY_TO_INSTALL:'shipping',INSTALLING:'installing',COMPLETED:'completed',CANCELLED:'cancelled'}[normalize(s)]||'waiting_payment')}
function label(s){return({PAYMENT_PENDING:'รอชำระเงิน',PAYMENT_REVIEW:'รอตรวจชำระ',PAID:'ชำระแล้ว',PREPARING:'กำลังเตรียมสินค้า',READY_TO_INSTALL:'พร้อมติดตั้ง',INSTALLING:'กำลังติดตั้ง',COMPLETED:'ส่งมอบแล้ว',CANCELLED:'ยกเลิก'})[normalize(s)]||s||'รอดำเนินการ'}
async function apiGet(action,params={}){const query=new URLSearchParams({action,...params});const res=await fetch(API_URL+'?'+query.toString(),{cache:'no-store'});return res.json()}
async function apiPost(payload){const res=await fetch(API_URL,{method:'POST',body:JSON.stringify(payload)});const text=await res.text();try{return JSON.parse(text)}catch(e){return{ok:false,message:text||'Invalid API response'}}}
async function loadOrders(){try{const data=await apiGet('listOrders',{});if(!data||!data.ok)throw new Error(data&&data.message?data.message:'โหลดคำสั่งซื้อไม่สำเร็จ');orders=Array.isArray(data.orders)?data.orders:[];render()}catch(err){orders=[];$('#orders').textContent=err.message||'โหลดคำสั่งซื้อไม่สำเร็จ';render()}}
async function setStatus(id,status){if(!confirm('ยืนยันเปลี่ยนสถานะคำสั่งซื้อ?'))return;try{const res=await apiPost({action:'updateOrderStatus',order_id:id,status,actor_id:'ADMIN'});if(!res||!res.ok)throw new Error(res&&res.message?res.message:'อัปเดตสถานะไม่สำเร็จ');await loadOrders()}catch(err){alert(err.message||'อัปเดตสถานะไม่สำเร็จ')}}
function nextAction(id,status){const actions={PAYMENT_PENDING:['PAYMENT_REVIEW','ตรวจชำระ'],PAYMENT_REVIEW:['PAID','ยืนยันชำระ'],PAID:['PREPARING','เตรียมสินค้า'],PREPARING:['READY_TO_INSTALL','พร้อมติดตั้ง'],READY_TO_INSTALL:['INSTALLING','เริ่มติดตั้ง'],INSTALLING:['COMPLETED','ส่งมอบแล้ว']};const next=actions[status];return next?`<button class="primary" onclick="setStatus('${esc(id)}','${next[0]}')">${next[1]}</button>`:''}
function render(){const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;const list=orders.filter(o=>(f==='all'||normalize(o.status)===f)&&[o.orderId,o.order_id,o.quoteId,o.quotation_id,o.customerName,o.customer?.name,o.agentName,o.agentId,o.model].join(' ').toLowerCase().includes(q));$('#all').textContent=orders.length;$('#wait').textContent=orders.filter(o=>['PAYMENT_PENDING','PAYMENT_REVIEW'].includes(normalize(o.status))).length;$('#install').textContent=orders.filter(o=>normalize(o.status)==='INSTALLING').length;$('#ship').textContent=orders.filter(o=>normalize(o.status)==='READY_TO_INSTALL').length;$('#done').textContent=orders.filter(o=>normalize(o.status)==='COMPLETED').length;if(!list.length){$('#orders').innerHTML='<div class="empty">ยังไม่มีคำสั่งซื้อ</div>';return}$('#orders').innerHTML=list.slice().reverse().map(o=>{const id=o.orderId||o.order_id||'';const status=normalize(o.status);return `<div class="order"><div><b>${esc(id||'-')}</b><small>${esc(o.quoteId||o.quotation_id||'-')}</small></div><div><b>${esc(o.customerName||o.customer?.name||'-')}</b><small>${esc(o.customer?.phone||o.customer_phone||'')}</small></div><div><b>${esc((o.model||'-')+' '+(o.storage||''))}</b><small>${esc((o.color||'')+' · '+(o.agentName||o.agentId||o.agent_id||'ตัวแทน'))}</small></div><div><b>${esc(money(o.grandTotal||o.grand_total))}</b><small>ยอดสุทธิ</small></div><div><span class="badge ${esc(statusClass(status))}">${esc(label(status))}</span></div><div class="actions">${nextAction(id,status)}${!['COMPLETED','CANCELLED'].includes(status)?`<button class="danger" onclick="setStatus('${esc(id)}','CANCELLED')">ยกเลิก</button>`:''}</div></div>`}).join('')}
$('#search').oninput=render;$('#filter').onchange=render;loadOrders();
</script></body></html>
