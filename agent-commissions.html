<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Commissions | SBOS</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/sbos-typography.css">
<link rel="stylesheet" href="css/sbos-finance.css">
</head>
<body>
<div class="finance-shell">
  <aside class="finance-side"><div class="finance-brand"><img src="images/logo.png" alt="SBOS"><div><b>SBOS Agent</b><span>Commission Center</span></div></div><nav class="finance-menu"><a href="agent-dashboard.html">Dashboard</a><a href="agent-wallet.html">Wallet</a><a class="active" href="agent-commissions.html">Commissions</a><a href="agent-withdrawals.html">Withdrawals</a><a href="agent-orders.html">Orders</a></nav></aside>
  <main class="finance-main"><header class="finance-top"><div><h1>Commissions</h1><p>รายการค่าคอมมิชชันจาก payment ที่ Admin อนุมัติแล้ว</p></div><button id="refresh" class="finance-action" type="button">Refresh</button></header>
  <div class="finance-content"><section class="finance-grid"><div class="finance-card"><span>Available Wallet</span><strong id="available">฿0</strong></div><div class="finance-card"><span>Pending</span><strong id="pending">฿0</strong></div><div class="finance-card"><span>Held</span><strong id="held">฿0</strong></div><div class="finance-card"><span>Total Items</span><strong id="total">0</strong></div></section>
  <section class="finance-panel"><div class="finance-toolbar"><input id="search" placeholder="Search commission, order, payment"><select id="filter"><option value="">All status</option><option>AVAILABLE</option><option>PENDING</option><option>HELD</option><option>REVERSED</option><option>CONFIG_REQUIRED</option></select></div><div class="finance-table-wrap"><table class="finance-table"><thead><tr><th>Commission</th><th>Order</th><th>Payment</th><th>Milestone</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading...</td></tr></tbody></table></div></section><div id="status" class="finance-status" role="status" aria-live="polite"></div></div></main>
</div>
<script src="js/agent-api.js"></script><script src="js/agent-guard.js"></script>
<script>
"use strict";let commissions=[];function badge(v){return '<span class="finance-badge '+esc(String(v||'').toLowerCase())+'">'+esc(v||'-')+'</span>'}function render(){const q=document.getElementById("search").value.toLowerCase();const f=document.getElementById("filter").value;const list=commissions.filter(c=>(!f||c.status===f)&&[c.commission_id,c.order_id,c.payment_id,c.milestone,c.product_id].join(" ").toLowerCase().includes(q));document.getElementById("total").textContent=list.length;document.getElementById("rows").innerHTML=list.length?list.map(c=>'<tr><td>'+esc(c.commission_id)+'</td><td>'+esc(c.order_id)+'</td><td>'+esc(c.payment_id)+'</td><td>'+esc(c.milestone)+'</td><td>'+esc(money(c.released_amount||c.pending_amount))+'</td><td>'+badge(c.status)+'</td><td>'+esc(formatDate(c.created_at))+'</td></tr>').join(""):'<tr><td colspan="7" class="finance-empty">No commission found</td></tr>'}
async function load(){document.getElementById("status").textContent="Loading...";const [summary,data]=await Promise.all([agentFinancePost("getAgentWallet",{}),agentFinancePost("listAgentCommissions",{limit:200})]);if(!summary.ok||!data.ok){document.getElementById("status").textContent=summary.message||data.message||"Load failed";return}const w=summary.wallet||{};document.getElementById("available").textContent=money(w.available_balance);document.getElementById("pending").textContent=money(w.pending_balance);document.getElementById("held").textContent=money(w.held_balance);commissions=data.commissions||[];render();document.getElementById("status").textContent="Updated"}
document.getElementById("search").addEventListener("input",render);document.getElementById("filter").addEventListener("change",render);document.getElementById("refresh").addEventListener("click",load);load();
</script>
</body>
</html>
